<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Groundwork — Learn AI from Zero</title>
<style>
  :root{
    --bg:#EFF3F7;
    --panel:#FFFFFF;
    --panel-alt:#F5F8FB;
    --border:#DCE3EC;
    --text:#1B2333;
    --text-dim:#6B7690;
    --accent:#5B5FEF;
    --accent-soft:rgba(91,95,239,0.10);
    --accent-dim:#4247C4;
    --gold:#FFB020;
    --gold-soft:rgba(255,176,32,0.14);
    --success:#1F9E89;
    --success-soft:rgba(31,158,137,0.12);
    --danger:#E15554;
    --font-display: "Segoe UI", system-ui, -apple-system, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
  }
  #app{display:flex; flex-direction:column; min-height:100vh;}

  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 24px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px; letter-spacing:-0.01em; font-family:var(--font-display);}
  .brand .mark{
    width:22px;height:22px;border-radius:6px;
    background:linear-gradient(135deg, var(--accent), var(--gold));
    flex-shrink:0;
  }
  header .spacer{flex:1;}
  .progress-summary{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim);}
  .progress-track{
    width:140px; height:8px; border-radius:5px;
    background:var(--panel-alt); border:1px solid var(--border);
    overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--accent), var(--gold));
    width:0%; transition:width .4s ease;
  }
  .reset-link{
    font-size:12px; color:var(--text-dim); cursor:pointer; text-decoration:underline;
    background:none; border:none; font-family:inherit;
  }

  main{
    flex:1;
    display:grid;
    grid-template-columns:280px 1fr;
    max-width:1180px;
    width:100%;
    margin:0 auto;
    gap:0;
  }

  /* ---------- Trail sidebar ---------- */
  .trail{
    padding:26px 18px 40px;
    position:relative;
  }
  .trail-line{
    position:absolute;
    left:37px; top:40px; bottom:40px;
    width:2px;
    background:var(--border);
    z-index:0;
  }
  .trail-item{
    position:relative;
    display:flex;
    gap:14px;
    align-items:flex-start;
    padding:11px 8px;
    border-radius:10px;
    cursor:pointer;
    z-index:1;
    margin-bottom:2px;
  }
  .trail-item:hover{background:var(--panel-alt);}
  .trail-item.active{background:var(--accent-soft);}
  .trail-dot{
    width:20px;height:20px;border-radius:50%;
    background:var(--panel);
    border:2px solid var(--border);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
    color:var(--text-dim);
    margin-top:1px;
  }
  .trail-item.done .trail-dot{
    background:var(--success);
    border-color:var(--success);
    color:white;
  }
  .trail-item.active .trail-dot{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .trail-text .t-title{font-size:13.5px; font-weight:600; color:var(--text); line-height:1.3;}
  .trail-item.active .t-title{color:var(--accent-dim);}
  .trail-text .t-sub{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

  /* ---------- Lesson content ---------- */
  .lesson-pane{
    padding:32px 40px 60px;
    min-width:0;
    border-left:1px solid var(--border);
  }
  .lesson-eyebrow{
    font-size:12px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--accent-dim); font-weight:700; margin-bottom:6px;
  }
  .lesson-title{
    font-family:var(--font-display);
    font-size:28px; font-weight:800; letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  .lesson-summary{color:var(--text-dim); font-size:14.5px; margin:0 0 26px; max-width:640px;}
  .lesson-content{
    font-size:15px; line-height:1.75; max-width:660px; color:#2A3142;
  }
  .lesson-content p{margin:0 0 14px;}
  .lesson-content ul, .lesson-content ol{margin:0 0 14px; padding-left:22px;}
  .lesson-content li{margin-bottom:6px;}
  .lesson-content strong{color:var(--text);}
  .callout{
    background:var(--gold-soft);
    border-left:3px solid var(--gold);
    border-radius:8px;
    padding:12px 16px;
    font-size:13.5px;
    margin:16px 0;
    max-width:640px;
  }
  .callout b{color:#7a4e00;}

  /* ---------- Quiz ---------- */
  .quiz-box{
    max-width:640px;
    margin-top:30px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px 22px;
  }
  .quiz-box h3{margin:0 0 14px; font-size:14px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-dim);}
  .quiz-q{margin-bottom:18px;}
  .quiz-q p{font-weight:600; font-size:14.5px; margin:0 0 8px;}
  .quiz-opt{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-radius:7px;
    font-size:13.5px; cursor:pointer;
    border:1px solid transparent;
  }
  .quiz-opt:hover{background:var(--panel-alt);}
  .quiz-opt input{accent-color:var(--accent);}
  .quiz-opt.correct{background:var(--success-soft); border-color:var(--success);}
  .quiz-opt.incorrect{background:rgba(225,85,84,0.10); border-color:var(--danger);}
  .quiz-feedback{font-size:13px; margin-top:6px; font-weight:600;}
  .quiz-feedback.ok{color:var(--success);}
  .quiz-feedback.no{color:var(--danger);}

  /* ---------- Ask AI box ---------- */
  .ask-box{
    max-width:640px; margin-top:26px;
    border:1px dashed var(--border);
    border-radius:12px;
    padding:18px 20px;
    background:var(--panel);
  }
  .ask-box h3{margin:0 0 4px; font-size:13.5px; color:var(--text);}
  .ask-box p.sub{margin:0 0 12px; font-size:12.5px; color:var(--text-dim);}
  .ask-row{display:flex; gap:8px;}
  .ask-row input{
    flex:1; padding:9px 12px; border-radius:7px;
    border:1px solid var(--border); font-size:13.5px; font-family:inherit;
  }
  .ask-row input:focus{outline:none; border-color:var(--accent);}
  .ask-row button{
    padding:9px 16px; border-radius:7px; border:1px solid var(--accent);
    background:var(--accent); color:white; font-weight:600; font-size:13px; cursor:pointer;
  }
  .ask-row button:disabled{opacity:0.5; cursor:not-allowed;}
  .ask-answer{
    margin-top:12px; font-size:13.5px; line-height:1.6; color:#2A3142;
    background:var(--panel-alt); border-radius:8px; padding:12px 14px; display:none;
  }
  .ask-loading{font-size:12.5px; color:var(--text-dim); display:none; margin-top:8px;}
  .dot-pulse{
    width:6px;height:6px;border-radius:50%; background:var(--accent);
    display:inline-block; margin-right:6px;
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.3} 50%{opacity:1}}

  .lesson-footer{
    max-width:640px;
    display:flex; justify-content:space-between; align-items:center;
    margin-top:34px; padding-top:20px; border-top:1px solid var(--border);
  }
  .nav-btn{
    padding:10px 18px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel); font-size:13.5px; font-weight:600; cursor:pointer; color:var(--text);
  }
  .nav-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .complete-btn{
    padding:10px 20px; border-radius:8px; border:1px solid var(--success);
    background:var(--success); color:white; font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .complete-btn.done{background:var(--panel); color:var(--success); cursor:default;}

  .finish-banner{
    max-width:640px; margin-top:24px; padding:18px 20px;
    background:linear-gradient(135deg, var(--accent-soft), var(--gold-soft));
    border-radius:12px; font-size:14px; font-weight:600; display:none;
  }

  @media (max-width: 820px){
    main{grid-template-columns:1fr;}
    .trail{display:none;}
    .lesson-pane{border-left:none; padding:24px 20px 50px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="mark"></span> Groundwork</div>
    <div class="spacer"></div>
    <div class="progress-summary">
      <span id="progressLabel">0 / 8 lessons</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="reset-link" id="resetBtn">Reset progress</button>
  </header>

  <main>
    <nav class="trail" id="trail">
      <div class="trail-line"></div>
    </nav>
    <section class="lesson-pane" id="lessonPane"></section>
  </main>
</div>

<script>
const MODULES = [
  {
    id:'m1', title:'What Even Is AI?', sub:'The basics, no jargon',
    summary:"Before touching any tool, let's get straight on what \"AI\" actually means — and what it doesn't.",
    content:`
      <p><strong>Artificial intelligence</strong> just means a computer program that can do things which normally seem to need human judgment — like recognizing a face, writing a sentence, or answering a question it wasn't explicitly told the answer to.</p>
      <p>Most of the AI you hear about today (ChatGPT, Claude, Gemini, image generators) is built using <strong>machine learning</strong>: instead of a programmer writing exact rules, the system is shown huge amounts of examples (text, images, code) and learns patterns from them. It's less "programmed" and more "trained" — like teaching by example rather than by instruction manual.</p>
      <p>The specific kind of AI behind chatbots is called a <strong>large language model (LLM)</strong>. It's trained to predict what text should come next, over and over, on a massive scale. That simple trick — predict the next word — turns out to be enough to hold conversations, write code, and explain ideas.</p>
      <div class="callout"><b>Good to know:</b> AI doesn't "understand" the way you do, and it doesn't know things are true — it generates the most likely-sounding response. That's why it can sound confident and still be wrong sometimes.</div>
      <p>That single idea — "confident but not infallible" — is the most important thing to carry into everything else in this course.</p>
    `,
    quiz:[
      {q:"What is machine learning, in plain terms?", options:["A robot that thinks like a human","A system that learns patterns from lots of examples instead of following fixed rules","A very fast calculator","A database of facts"], correct:1},
      {q:"Why can an AI chatbot sound confident but still be wrong?", options:["It's being sarcastic","It only works on weekdays","It generates likely-sounding text, which isn't the same as verified truth","It's broken"], correct:2}
    ]
  },
  {
    id:'m2', title:'Meet the AI Chatbots', sub:'ChatGPT, Claude, Gemini & friends',
    summary:"A quick tour of the tools everyone's talking about, and what actually sets them apart.",
    content:`
      <p>There isn't just one AI chatbot — there's a small family of them, made by different companies, all doing roughly the same core thing (having a conversation) with different strengths:</p>
      <ul>
        <li><strong>ChatGPT</strong> (OpenAI) — the one that kicked off the boom. Good all-rounder, huge plugin/app ecosystem.</li>
        <li><strong>Claude</strong> (Anthropic) — this one! Known for careful, well-reasoned writing, strong coding help, and handling long documents well.</li>
        <li><strong>Gemini</strong> (Google) — tightly built into Google's own apps (Search, Docs, Gmail).</li>
        <li><strong>Copilot</strong> (Microsoft) — AI baked into Windows and Office.</li>
      </ul>
      <p>Beyond text chatbots, there's a wider toolbox: <strong>image generators</strong> (Midjourney, DALL·E) turn text into pictures, <strong>coding assistants</strong> (Claude Code, GitHub Copilot) write and fix code, and <strong>voice AI</strong> tools can hold spoken conversations.</p>
      <div class="callout"><b>Good to know:</b> You don't need to pick "the best one." Most people end up using two or three tools for different jobs — one for writing, one for coding, one for images.</div>
    `,
    quiz:[
      {q:"What are Claude, ChatGPT, and Gemini all examples of?", options:["Video games","Search engines only","AI chatbots built on language models","Antivirus software"], correct:2},
      {q:"What's a coding assistant used for?", options:["Generating pictures","Writing and fixing code","Booking flights","Playing music"], correct:1}
    ]
  },
  {
    id:'m3', title:'Talking to AI: Prompting 101', sub:'How to actually get good answers',
    summary:"The single biggest skill gap between people who \"tried AI once\" and people who use it daily is one thing: how they ask.",
    content:`
      <p>A <strong>prompt</strong> is just what you type to the AI. Vague prompts get vague answers. The fix is almost always the same: add specifics.</p>
      <ul>
        <li><strong>Say what you want, clearly.</strong> "Write about dogs" → "Write a 100-word paragraph for kids explaining why dogs wag their tails."</li>
        <li><strong>Give context.</strong> Who is this for? What's it going to be used for? What do you already know?</li>
        <li><strong>Set the format.</strong> Want a list? A table? Three sentences? Say so directly.</li>
        <li><strong>Iterate.</strong> Your first prompt rarely needs to be perfect — treat it like a conversation. "Make that shorter." "More casual tone." "Add an example."</li>
      </ul>
      <div class="callout"><b>Try this:</b> Instead of asking "How do I learn Spanish?" try "I'm a complete beginner with 15 minutes a day and want to speak basic travel Spanish in 3 months — give me a simple weekly plan."</div>
      <p>Notice how the second version tells the AI your level, your time budget, your goal, and the format you want. That's the whole skill.</p>
    `,
    quiz:[
      {q:"Which prompt is more likely to get a useful answer?", options:["\"Tell me about marketing\"","\"Give me 5 low-budget marketing ideas for a small coffee shop, as a bulleted list\"","\"Marketing??\"","\"Help\""], correct:1},
      {q:"What should you do if the AI's first answer isn't quite right?", options:["Give up and assume AI doesn't work","Start over in a new conversation every time","Refine it — tell it what to change, just like a real conversation","Only use it for simple questions"], correct:2}
    ]
  },
  {
    id:'m4', title:'Leveling Up Your Prompts', sub:'Techniques the pros use',
    summary:"Once the basics click, a few extra techniques make a noticeable difference in quality.",
    content:`
      <p><strong>Give it a role.</strong> "Act as an experienced nutritionist" or "You're a strict code reviewer" shapes the tone and depth of the answer.</p>
      <p><strong>Show, don't just tell.</strong> If you want a specific style, give an example: "Write it in this style: [paste example]." AI is very good at matching patterns you show it.</p>
      <p><strong>Ask it to think step by step.</strong> For anything involving reasoning or math, adding "think through this step by step before giving your final answer" noticeably improves accuracy.</p>
      <p><strong>Break big tasks into steps.</strong> Instead of "write my whole business plan," try "let's start with just the executive summary" and build piece by piece.</p>
      <div class="callout"><b>Good to know:</b> Long, detailed prompts aren't "showing off" — they genuinely produce better results than short vague ones. Specificity is the whole game.</div>
    `,
    quiz:[
      {q:"What does giving AI a \"role\" (like \"act as a lawyer\") do?", options:["Nothing, it's just for fun","Shapes the tone, focus, and depth of its answer","Makes it slower","Unlocks a paid feature"], correct:1},
      {q:"Why ask AI to \"think step by step\" on a tricky problem?", options:["It makes the answer longer for no reason","It noticeably improves accuracy on reasoning tasks","It's required for every prompt","It changes the AI's personality permanently"], correct:1}
    ]
  },
  {
    id:'m5', title:'The AI Toolbox', sub:'Beyond chatting',
    summary:"Chatbots are just the entry point. Here's what else is out there — and what each type of tool is actually for.",
    content:`
      <p><strong>Image generation</strong> (Midjourney, DALL·E, Stable Diffusion): describe an image in words, get a picture. Great for concept art, mockups, social graphics — not for anything needing exact accuracy (like a specific real logo).</p>
      <p><strong>Coding assistants</strong> (Claude Code, GitHub Copilot): write, explain, and debug code inside your editor or terminal. Even non-programmers use these to build small tools or fix scripts.</p>
      <p><strong>AI-powered search</strong> (Perplexity, Claude/ChatGPT with web search): gets you an answer with sources instead of a list of links to click through.</p>
      <p><strong>Voice & audio AI</strong>: transcription (turning speech into text), text-to-speech, and real-time voice conversation.</p>
      <p><strong>Office-embedded AI</strong> (Copilot in Word/Excel, Claude in Chrome/Excel): AI that works directly inside the tools you already use, rather than a separate chat window.</p>
      <div class="callout"><b>Good to know:</b> The right tool depends on the job, not the hype. Writing task → chatbot. Visual → image generator. Repetitive spreadsheet task → office-embedded AI or a coding assistant.</div>
    `,
    quiz:[
      {q:"What's image generation AI best suited for?", options:["Exact reproductions of real logos","Concept art, mockups, and social graphics","Legal contracts","Precise financial calculations"], correct:1},
      {q:"What does AI-powered search typically give you that a normal search engine doesn't?", options:["Only ads","A direct answer with sources, instead of a list of links","Slower results","Nothing different"], correct:1}
    ]
  },
  {
    id:'m6', title:'AI at Work', sub:'Turning this into real productivity',
    summary:"Here's where the skills become genuinely useful day to day — at your job, in school, or running your own thing.",
    content:`
      <p><strong>Writing & editing:</strong> drafting emails, polishing tone, summarizing long documents or meeting notes into key points.</p>
      <p><strong>Research:</strong> asking AI to explain unfamiliar topics, compare options, or pull together a first-pass overview before you dig deeper yourself.</p>
      <p><strong>Data & spreadsheets:</strong> asking AI to explain a formula, clean messy data, or describe what a dataset shows — even without expert spreadsheet skills.</p>
      <p><strong>Planning:</strong> breaking a big project into steps, drafting a schedule, or brainstorming options when you're stuck.</p>
      <div class="callout"><b>Good to know:</b> Treat AI output as a strong first draft, not a final answer — especially for anything with numbers, quotes, or facts that matter. Always give it a human check before it goes out the door.</div>
      <p>The people who get the most value aren't the ones who ask AI to "do their job" — they're the ones who use it to remove the slow, repetitive 20% so they can spend more time on the part that actually needs a human.</p>
    `,
    quiz:[
      {q:"What's a good way to think about AI-generated work output?", options:["Always final and ready to send","A strong first draft that still needs a human check","Never useful for real work","Only good for jokes"], correct:1},
      {q:"Which is a good everyday use of AI at work?", options:["Summarizing long meeting notes into key points","Making final legal decisions with no review","Replacing your job title","None of the above"], correct:0}
    ]
  },
  {
    id:'m7', title:'Building with AI', sub:'From using tools to connecting them',
    summary:"Once you're comfortable using AI, the next level is having it act on your behalf — connected to your actual tools and data.",
    content:`
      <p>Modern AI assistants can go beyond chatting — they can be connected to other apps (calendars, email, project trackers) so they can look things up or take actions for you, with your permission at each step.</p>
      <p><strong>Agents</strong> are AI setups that can take a goal and carry out multiple steps on their own — searching, checking results, adjusting, and trying again — instead of just answering one question.</p>
      <p><strong>No-code AI tools</strong> let you build simple automations (like "when I get an email with an invoice, summarize it and add it to a spreadsheet") without writing a single line of code.</p>
      <div class="callout"><b>Good to know:</b> The more autonomy you give an AI tool (letting it send emails, spend money, or edit files on its own), the more important it is to double-check what it's set up to do — start with read-only or low-stakes tasks first.</div>
      <p>You don't need to build anything complex to benefit from this — even just connecting an AI chatbot to your calendar or documents saves real time.</p>
    `,
    quiz:[
      {q:"What's an \"agent\" in the AI sense?", options:["A customer service phone line","An AI setup that can carry out multi-step goals on its own","A type of image filter","A paid subscription tier only"], correct:1},
      {q:"What's a sensible first step before giving an AI tool more autonomy (like sending emails automatically)?", options:["Give it full access immediately","Start with low-stakes or read-only tasks and check its work","Never let AI touch anything","Only use it once a year"], correct:1}
    ]
  },
  {
    id:'m8', title:'Staying Safe & Smart', sub:'The habits that keep you out of trouble',
    summary:"The final and most important module: using AI well means using it critically.",
    content:`
      <p><strong>Verify anything that matters.</strong> AI can state something false with total confidence (this is called a "hallucination"). For facts, numbers, quotes, or anything with real consequences — double-check with a real source.</p>
      <p><strong>Watch what you share.</strong> Be thoughtful about pasting sensitive personal data, private company info, or anything confidential into an AI tool unless you know how that provider handles data.</p>
      <p><strong>Know it can be biased.</strong> AI learns from human-written data, which contains human biases. It's a helpful assistant, not a neutral oracle — especially on contested or sensitive topics.</p>
      <p><strong>Respect copyright.</strong> AI can draw on styles and information, but presenting AI output as entirely original work, or reproducing copyrighted material, is worth thinking about the same way you'd think about any other content.</p>
      <div class="callout"><b>Good to know:</b> "Trust, but verify" is the single best habit to walk away with. AI is a genuinely powerful assistant — treat it like a very fast, very well-read colleague who occasionally gets things wrong with total confidence.</div>
    `,
    quiz:[
      {q:"What's a \"hallucination\" in AI terms?", options:["A visual glitch on your screen","When AI states something false with confidence, as if it were true","A type of virus","A special AI feature you should always turn on"], correct:1},
      {q:"What's the best overall habit to carry forward when using AI?", options:["Trust every answer completely","Never use it for anything important","Trust it, but verify anything that really matters","Only use it in private"], correct:2}
    ]
  }
];

let progress = { completed: [] };
let currentIndex = 0;
let storageReady = false;

async function loadProgress(){
  try {
    const result = await window.storage.get('groundwork-progress', false);
    if (result && result.value){
      progress = JSON.parse(result.value);
    }
  } catch(e){
    progress = { completed: [] };
  }
  storageReady = true;
}

async function saveProgress(){
  try {
    await window.storage.set('groundwork-progress', JSON.stringify(progress), false);
  } catch(e){
    console.error('Could not save progress', e);
  }
}

function renderTrail(){
  const trail = document.getElementById('trail');
  trail.querySelectorAll('.trail-item').forEach(el => el.remove());
  MODULES.forEach((m, i) => {
    const item = document.createElement('div');
    item.className = 'trail-item' + (i === currentIndex ? ' active' : '') + (progress.completed.includes(m.id) ? ' done' : '');
    item.innerHTML = `
      <div class="trail-dot">${progress.completed.includes(m.id) ? '✓' : (i+1)}</div>
      <div class="trail-text">
        <div class="t-title">${m.title}</div>
        <div class="t-sub">${m.sub}</div>
      </div>
    `;
    item.addEventListener('click', () => { currentIndex = i; render(); });
    trail.appendChild(item);
  });
}

function updateHeaderProgress(){
  const total = MODULES.length;
  const done = progress.completed.length;
  document.getElementById('progressLabel').textContent = done + ' / ' + total + ' lessons';
  document.getElementById('progressFill').style.width = (done/total*100) + '%';
}

function renderLesson(){
  const m = MODULES[currentIndex];
  const isDone = progress.completed.includes(m.id);
  const pane = document.getElementById('lessonPane');

  let quizHtml = `<div class="quiz-box"><h3>Quick check</h3>`;
  m.quiz.forEach((q, qi) => {
    quizHtml += `<div class="quiz-q" data-qi="${qi}">
      <p>${q.q}</p>
      ${q.options.map((opt, oi) => `
        <label class="quiz-opt" data-oi="${oi}">
          <input type="radio" name="q${qi}" value="${oi}"> ${opt}
        </label>
      `).join('')}
      <div class="quiz-feedback" id="feedback-${qi}"></div>
    </div>`;
  });
  quizHtml += `</div>`;

  pane.innerHTML = `
    <div class="lesson-eyebrow">Lesson ${currentIndex + 1} of ${MODULES.length}</div>
    <h1 class="lesson-title">${m.title}</h1>
    <p class="lesson-summary">${m.summary}</p>
    <div class="lesson-content">${m.content}</div>
    ${quizHtml}
    <div class="ask-box">
      <h3>Ask about this lesson</h3>
      <p class="sub">Confused about something above? Ask and get a quick answer.</p>
      <div class="ask-row">
        <input type="text" id="askInput" placeholder="e.g. what's the difference between AI and machine learning again?" />
        <button id="askBtn">Ask</button>
      </div>
      <div class="ask-loading" id="askLoading"><span class="dot-pulse"></span>Thinking…</div>
      <div class="ask-answer" id="askAnswer"></div>
    </div>
    <div class="lesson-footer">
      <button class="nav-btn" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
      <button class="complete-btn ${isDone ? 'done' : ''}" id="completeBtn">${isDone ? '✓ Completed' : 'Mark complete'}</button>
      <button class="nav-btn" id="nextBtn" ${currentIndex === MODULES.length - 1 ? 'disabled' : ''}>Next →</button>
    </div>
  `;

  // Quiz interactions
  pane.querySelectorAll('.quiz-q').forEach(qEl => {
    const qi = parseInt(qEl.getAttribute('data-qi'));
    const correct = m.quiz[qi].correct;
    qEl.querySelectorAll('input[type=radio]').forEach(input => {
      input.addEventListener('change', () => {
        const oi = parseInt(input.value);
        qEl.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('correct','incorrect'));
        const chosenLabel = qEl.querySelector(`.quiz-opt[data-oi="${oi}"]`);
        const feedback = document.getElementById('feedback-' + qi);
        if (oi === correct){
          chosenLabel.classList.add('correct');
          feedback.textContent = 'Correct!';
          feedback.className = 'quiz-feedback ok';
        } else {
          chosenLabel.classList.add('incorrect');
          qEl.querySelector(`.quiz-opt[data-oi="${correct}"]`).classList.add('correct');
          feedback.textContent = 'Not quite — the highlighted one is correct.';
          feedback.className = 'quiz-feedback no';
        }
      });
    });
  });

  document.getElementById('prevBtn').addEventListener('click', () => { if (currentIndex > 0){ currentIndex--; render(); }});
  document.getElementById('nextBtn').addEventListener('click', () => { if (currentIndex < MODULES.length - 1){ currentIndex++; render(); }});
  document.getElementById('completeBtn').addEventListener('click', async () => {
    if (!progress.completed.includes(m.id)){
      progress.completed.push(m.id);
      await saveProgress();
      render();
    }
  });

  const askBtn = document.getElementById('askBtn');
  const askInput = document.getElementById('askInput');
  askBtn.addEventListener('click', () => askQuestion(m));
  askInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') askQuestion(m); });
}

async function askQuestion(m){
  const input = document.getElementById('askInput');
  const question = input.value.trim();
  if (!question) return;
  const loading = document.getElementById('askLoading');
  const answerEl = document.getElementById('askAnswer');
  const btn = document.getElementById('askBtn');
  btn.disabled = true;
  loading.style.display = 'block';
  answerEl.style.display = 'none';

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 400,
        system: "You are a friendly, patient AI tutor inside a beginner course called Groundwork. The learner just read this lesson titled '" + m.title + "': " + m.summary + " Answer their follow-up question simply, in plain language, in 2-4 short sentences max. No jargon unless you immediately explain it. No markdown headers.",
        messages: [{ role: "user", content: question }]
      })
    });
    if (!response.ok) throw new Error("Request failed (" + response.status + ")");
    const data = await response.json();
    const text = (data.content || []).map(b => b.type === 'text' ? b.text : '').filter(Boolean).join('\n');
    answerEl.textContent = text.trim();
    answerEl.style.display = 'block';
  } catch(err){
    answerEl.textContent = "Couldn't get an answer right now: " + err.message;
    answerEl.style.display = 'block';
  } finally {
    loading.style.display = 'none';
    btn.disabled = false;
  }
}

function render(){
  renderTrail();
  renderLesson();
  updateHeaderProgress();
}

document.getElementById('resetBtn').addEventListener('click', async () => {
  progress = { completed: [] };
  await saveProgress();
  currentIndex = 0;
  render();
});

(async function init(){
  await loadProgress();
  render();
})();
</script>
</body>
</html>
