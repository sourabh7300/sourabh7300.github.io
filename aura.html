<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA — Holographic AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#020709;--cy:#22d3ee;--cy2:#67e8f9;--dim:#0e7490;--ice:#e0faff;
  --panel:rgba(4,18,26,.72);--line:rgba(34,211,238,.28);--line2:rgba(34,211,238,.14);
  --amber:#fbbf24;--red:#f87171;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ice);font-family:'Rajdhani',system-ui,sans-serif;overflow:hidden}
::selection{background:var(--cy);color:#000}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-thumb{background:#164e5a;border-radius:4px}

canvas#fx{position:fixed;inset:0;z-index:0}
#scan{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px);}
#scan::before{content:"";position:absolute;left:0;right:0;height:110px;top:-110px;
  background:linear-gradient(180deg,transparent,rgba(34,211,238,.06),transparent);animation:scanmove 7s linear infinite}
@keyframes scanmove{to{transform:translateY(calc(100vh + 220px))}}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.corner{position:fixed;width:34px;height:34px;z-index:3;pointer-events:none;border:2px solid var(--line)}
.corner.tl{top:12px;left:12px;border-right:0;border-bottom:0}
.corner.tr{top:12px;right:12px;border-left:0;border-bottom:0}
.corner.bl{bottom:12px;left:12px;border-right:0;border-top:0}
.corner.br{bottom:12px;right:12px;border-left:0;border-top:0}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:18px;padding:14px 26px}
.wordmark{font-family:'Orbitron';font-weight:900;font-size:21px;letter-spacing:5px;color:var(--cy2);text-shadow:0 0 18px rgba(34,211,238,.6)}
.wordmark small{display:block;font-family:var(--mono);font-weight:400;font-size:9px;letter-spacing:3px;color:var(--dim)}
#stateBox{margin:0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);padding:7px 18px;border-radius:20px}
#stateDot{width:9px;height:9px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy);animation:pp 1.6s infinite}
@keyframes pp{50%{opacity:.35}}
#stateText{font-family:var(--mono);font-size:11px;letter-spacing:2.5px;color:var(--cy2)}
#clock{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:1px;text-align:right}
#clock b{color:var(--ice);font-size:15px;display:block}

/* ---------- side panels ---------- */
.panel{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line2);backdrop-filter:blur(8px);border-radius:12px;padding:14px 16px}
.panel h3{font-family:'Orbitron';font-size:10px;letter-spacing:3px;color:var(--dim);margin-bottom:10px;font-weight:800}
#telemetry{top:74px;left:22px;width:225px}
.trow{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed rgba(34,211,238,.12)}
.trow:last-child{border:0}
.trow span{color:#5f8f9e;letter-spacing:.5px}
.trow b{font-family:var(--mono);font-weight:400;color:var(--ice);font-size:11.5px}
.trow b.on{color:#34d399}.trow b.off{color:var(--red)}
#syslog{bottom:110px;left:22px;width:225px;max-height:160px;overflow:hidden}
#syslogLines{font-family:var(--mono);font-size:10px;color:#3f7a8a;line-height:1.8}
#syslogLines .hot{color:var(--cy2)}

/* ---------- conversation ---------- */
#conv{top:74px;right:22px;width:min(370px,34vw);bottom:130px;display:flex;flex-direction:column;border:1px solid var(--line)}
#conv h3{display:flex;justify-content:space-between;align-items:center}
#conv h3 span:last-child{font-family:var(--mono);font-weight:400;font-size:9px;color:var(--dim)}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.msg{font-size:14.5px;line-height:1.5;letter-spacing:.2px}
.msg .who{font-family:'Orbitron';font-size:9px;letter-spacing:2.5px;display:block;margin-bottom:3px}
.msg.aura .who{color:var(--cy)}
.msg.user{color:#f3f6f6}
.msg.user .who{color:var(--amber)}
.msg.sys{color:#5f8f9e;font-family:var(--mono);font-size:11px}
#chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:var(--cy2);border:1px solid var(--line);background:rgba(34,211,238,.06);border-radius:14px;padding:5px 11px;cursor:pointer;transition:.2s}
.chip:hover{background:rgba(34,211,238,.18);box-shadow:0 0 12px rgba(34,211,238,.25)}

/* ---------- bottom controls ---------- */
#dock{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(640px,92vw)}
#micWrap{display:flex;flex-direction:column;align-items:center;gap:6px}
#micBtn{width:66px;height:66px;border-radius:50%;border:2px solid var(--cy);background:radial-gradient(circle at 50% 35%,rgba(34,211,238,.35),rgba(4,18,26,.9));color:var(--cy2);font-size:24px;cursor:pointer;transition:.25s;box-shadow:0 0 24px rgba(34,211,238,.35),inset 0 0 18px rgba(34,211,238,.15)}
#micBtn:hover{transform:scale(1.06)}
#micBtn.listening{border-color:var(--red);color:#fecaca;box-shadow:0 0 34px rgba(248,113,113,.5);animation:pp 1s infinite}
#micHint{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--dim)}
#inputRow{display:flex;gap:9px;width:100%}
#q{flex:1;background:rgba(4,18,26,.85);border:1px solid var(--line);border-radius:24px;color:var(--ice);font-family:'Rajdhani';font-size:16px;font-weight:500;padding:13px 20px;outline:0;letter-spacing:.3px;backdrop-filter:blur(6px)}
#q:focus{border-color:var(--cy2);box-shadow:0 0 18px rgba(34,211,238,.25)}
#sendBtn{border:1px solid var(--cy);background:rgba(34,211,238,.15);color:var(--cy2);border-radius:24px;width:50px;font-size:17px;cursor:pointer;transition:.2s}
#sendBtn:hover{background:rgba(34,211,238,.3)}
.iconrow{display:flex;gap:9px}
.ibtn{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:#5f8f9e;border:1px solid var(--line2);background:rgba(4,18,26,.6);border-radius:8px;padding:6px 12px;cursor:pointer;transition:.2s}
.ibtn:hover{color:var(--cy2);border-color:var(--line)}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;background:#010507;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;transition:opacity .7s,visibility .7s;font-family:var(--mono)}
#boot.gone{opacity:0;visibility:hidden}
#bootRing{width:110px;height:110px;border-radius:50%;border:2px solid rgba(34,211,238,.2);border-top-color:var(--cy);animation:spin 1s linear infinite;position:relative}
#bootRing::after{content:"AURA";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-size:13px;letter-spacing:4px;color:var(--cy2);animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
#bootLog{min-height:90px;text-align:center;font-size:11px;color:#3f7a8a;line-height:2}
#bootLog .ok{color:#34d399}
#bootSkip{font-size:9px;color:#28505c;letter-spacing:2px}

@media(max-width:1100px){#telemetry,#syslog{display:none}#conv{width:min(340px,44vw)}}
@media(max-width:760px){#conv{display:none}.wordmark{font-size:16px;letter-spacing:3px}}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div id="scan"></div><div id="vig"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div id="topbar">
  <div class="wordmark">AURA<small>HOLOGRAPHIC AI INTERFACE</small></div>
  <div id="stateBox"><span id="stateDot"></span><span id="stateText">SYSTEM ONLINE</span></div>
  <div id="clock"><b id="clockT">--:--</b><span id="clockD"></span></div>
</div>

<div class="panel" id="telemetry">
  <h3>TELEMETRY</h3>
  <div class="trow"><span>UPLINK</span><b id="tNet" class="on">ONLINE</b></div>
  <div class="trow"><span>RENDER</span><b id="tFps">— fps</b></div>
  <div class="trow"><span>CORE PTS</span><b id="tPts">—</b></div>
  <div class="trow"><span>MEMORY</span><b id="tMem">—</b></div>
  <div class="trow"><span>POWER</span><b id="tBat">—</b></div>
  <div class="trow"><span>DISPLAY</span><b id="tRes">—</b></div>
  <div class="trow"><span>UPTIME</span><b id="tUp">0:00</b></div>
  <div class="trow"><span>ENGINE</span><b id="tEng">—</b></div>
</div>

<div class="panel" id="syslog">
  <h3>SYSTEM LOG</h3>
  <div id="syslogLines"></div>
</div>

<div class="panel" id="conv">
  <h3><span>NEURAL LINK</span><span id="engTag">engine: auto</span></h3>
  <div id="log"></div>
  <div id="chips">
    <button class="chip">who are you?</button>
    <button class="chip">who built you?</button>
    <button class="chip">what can you do?</button>
    <button class="chip">run diagnostics</button>
    <button class="chip">tell me a joke</button>
  </div>
</div>

<div id="dock">
  <div id="chipsMobile" style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center"></div>
  <div id="micWrap">
    <button id="micBtn" title="Tap and speak">🎙</button>
    <span id="micHint">TAP TO SPEAK</span>
  </div>
  <div id="inputRow">
    <input id="q" placeholder="Type a command, or tap the mic and just talk…" autocomplete="off">
    <button id="sendBtn">▸</button>
  </div>
  <div class="iconrow">
    <button class="ibtn" id="soundBtn">SOUND: ON</button>
    <button class="ibtn" id="fsBtn">FULLSCREEN</button>
    <button class="ibtn" id="keyBtn">SET AI KEY</button>
  </div>
</div>

<div id="boot">
  <div id="bootRing"></div>
  <div id="bootLog"></div>
  <div id="bootSkip">TAP TO SKIP</div>
</div>

<script>
"use strict";
/* ============================================================
   AURA — holographic AI assistant. One file, zero frameworks.
   Hand-rolled 3D particle core, state machine, voice I/O,
   real AI (Puter.js / Gemini key) with offline fallback.
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------------- state machine ---------------- */
const STATES={
  idle:     {label:"SYSTEM ONLINE",      rot:.0035, pulse:.25, ring:1},
  listening:{label:"LISTENING…",          rot:.006,  pulse:.85, ring:2.2},
  thinking: {label:"PROCESSING",          rot:.02,   pulse:.55, ring:1.4},
  speaking: {label:"RESPONDING",          rot:.008,  pulse:.7,  ring:1.8},
  alert:    {label:"UPLINK ERROR — OFFLINE MODE", rot:.004, pulse:.4, ring:1},
};
let mode="idle",modeT=0;
function setMode(m){mode=m;modeT=0;$("stateText").textContent=STATES[m].label;}

/* ---------------- 3D particle core ---------------- */
const cv=$("fx"),cx=cv.getContext("2d");
let W,H,CX,CY,R;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;CX=W/2;CY=H*.46;R=Math.min(W,H)*.21;}
size();addEventListener("resize",size);
const N=560,pts=[];
for(let i=0;i<N;i++){
  const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),phi=i*2.399963229728653;
  pts.push({x:Math.cos(phi)*r,y,z:Math.sin(phi)*r});
}
let rot=0,wavePhase=0,amp=0,ampTarget=0,heart=0;
const PERSP=3.2;

/* ---------------- ambient grid horizon ---------------- */
function drawGrid(t){
  const hz=H*.82,vpx=CX;
  cx.save();
  cx.strokeStyle="rgba(34,211,238,.16)";cx.lineWidth=1;
  for(let i=-14;i<=14;i++){ // verticals fanning from vanishing point
    const x2=vpx+i*(W/9);
    cx.beginPath();cx.moveTo(vpx+i*14,hz);cx.lineTo(x2,H);cx.globalAlpha=.5;cx.stroke();
  }
  cx.globalAlpha=1;
  const speed=.9,gap=44,off=(t*speed)%gap;
  for(let k=0;k<9;k++){ // horizontals, exponential spacing
    const p=(k*gap+off)/9;
    const y=hz+Math.pow(p/9,1.9)*(H-hz);
    cx.globalAlpha=clamp((y-hz)/(H-hz)*1.2,0,.5);
    cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();
  }
  cx.globalAlpha=.5; // horizon glow line
  const g=cx.createLinearGradient(0,hz-1,0,hz+1);
  g.addColorStop(0,"rgba(34,211,238,0)");g.addColorStop(.5,"rgba(103,232,249,.8)");g.addColorStop(1,"rgba(34,211,238,0)");
  cx.strokeStyle=g;cx.beginPath();cx.moveTo(0,hz);cx.lineTo(W,hz);cx.stroke();
  cx.restore();
}

/* ---------------- rings ---------------- */
function drawRings(t,s){
  cx.save();cx.translate(CX,CY);
  const rings=[[R*1.32,.9,.5,1],[R*1.52,-.6,-.34,2],[R*1.78,.35,.2,3]];
  rings.forEach((rg,ri)=>{
    const[rr,spd,tilt,seg]=rg;
    cx.save();cx.rotate(t*spd*.2);
    cx.strokeStyle=`rgba(34,211,238,${.28*s.ring})`;cx.lineWidth=1.2;
    cx.beginPath();cx.ellipse(0,0,rr,rr*Math.abs(.32+tilt*.18),tilt,0,7);cx.stroke();
    for(let i=0;i<seg;i++){ // tick marks
      const a=t*spd+i*6.28/seg;
      const x=Math.cos(a)*rr,y=Math.sin(a)*rr*(.32+tilt*.18);
      cx.fillStyle="rgba(103,232,249,.9)";
      cx.beginPath();cx.arc(x,y,2.2,0,7);cx.fill();
    }
    cx.restore();
  });
  cx.restore();
}

/* ---------------- the core ---------------- */
function drawCore(dt){
  const s=STATES[mode];
  rot+=dt*(mode==="thinking"?5:mode==="listening"?2.2:1)*s.rot*60;
  wavePhase+=dt*(mode==="speaking"?9:2);
  heart+=dt*(mode==="listening"?5.2:1.6);
  amp+=(ampTarget-amp)*.08;
  const breathe=1+Math.sin(heart)*0.03*s.pulse;
  cx.save();cx.translate(CX,CY);
  // inner glow
  const gl=cx.createRadialGradient(0,0,0,0,0,R*1.15*breathe);
  gl.addColorStop(0,`rgba(34,211,238,${.10+.14*s.pulse})`);gl.addColorStop(1,"rgba(34,211,238,0)");
  cx.fillStyle=gl;cx.beginPath();cx.arc(0,0,R*1.15*breathe,0,7);cx.fill();
  // listening shockwaves
  if(mode==="listening"){
    for(let k=0;k<3;k++){
      const p=((heart*.6+k/3)%1);
      cx.strokeStyle=`rgba(103,232,249,${.5*(1-p)})`;cx.lineWidth=1.6;
      cx.beginPath();cx.arc(0,0,R*(1+p*.55),0,7);cx.stroke();
    }
  }
  // particles
  const ca=Math.cos(rot),sa=Math.sin(rot);
  for(let i=0;i<N;i++){
    const p=pts[i];
    let x=p.x*ca-p.z*sa,z=p.x*sa+p.z*ca,y=p.y;
    if(mode==="speaking"){const d=1+Math.sin(wavePhase+y*7+i*.13)*.055*amp;x*=d;y*=d;z*=d;}
    if(mode==="thinking"){x+=Math.sin(wavePhase*3+i)*0.012;z+=Math.cos(wavePhase*3+i*1.7)*0.012;}
    const sc=PERSP/(PERSP+z);
    const px=x*R*sc*breathe,py=y*R*sc*breathe;
    const sz=clamp(sc*1.9,.4,2.6),al=clamp((sc-.55)*1.6,.06,.95)*(.55+.45*s.pulse);
    cx.fillStyle=`rgba(150,235,250,${al})`;
    cx.beginPath();cx.arc(px,py,sz,0,7);cx.fill();
  }
  // waveform ring while speaking
  if(mode==="speaking"){
    cx.strokeStyle="rgba(103,232,249,.8)";cx.lineWidth=1.8;cx.beginPath();
    for(let a=0;a<=6.3;a+=.09){
      const rr=R*1.06+Math.sin(a*9+wavePhase*2.2)*8*amp+Math.sin(a*23-wavePhase*3.1)*4*amp;
      const x=Math.cos(a)*rr,y=Math.sin(a)*rr;
      a?cx.lineTo(x,y):cx.moveTo(x,y);
    }
    cx.closePath();cx.stroke();
  }
  // center nucleus
  const nl=.5+.5*Math.sin(heart*1.3);
  cx.fillStyle=`rgba(190,250,255,${.55+.4*nl})`;
  cx.beginPath();cx.arc(0,0,4.5+nl*2,0,7);cx.fill();
  cx.restore();
}

/* ---------------- render loop ---------------- */
let last=performance.now(),fpsN=0,fpsT=0,fpsVal=0,bootT0=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=clamp((now-last)/1000,0,.05);last=now;modeT+=dt;
  fpsN++;if(now-fpsT>1000){fpsVal=fpsN;fpsN=0;fpsT=now;}
  cx.clearRect(0,0,W,H);
  drawGrid(now/1000);
  drawRings(now/1000,STATES[mode]);
  drawCore(dt);
  if(mode==="thinking"&&modeT>14){setMode("idle");pushSys("uplink timeout — answering locally");}
}
requestAnimationFrame(frame);

/* ---------------- audio blips ---------------- */
let soundOn=true,AC=null;
function blip(f,dur,type){if(!soundOn)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.06,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}catch(e){}}

/* ---------------- system log ---------------- */
function slog(msg,hot){const el=$("syslogLines"),d=document.createElement("div");
  d.textContent="▸ "+msg;if(hot)d.className="hot";el.appendChild(d);
  while(el.children.length>7)el.firstChild.remove();}
slog("aura kernel v3.1 loaded");slog("particle core: 560 nodes",true);slog("voice interface ready");

/* ---------------- conversation ---------------- */
const log=$("log");
function addMsg(who,text,cls){
  const d=document.createElement("div");d.className="msg "+cls;
  d.innerHTML='<span class="who">'+who+'</span><span class="tx"></span>';
  log.appendChild(d);while(log.children.length>40)log.firstChild.remove();
  log.scrollTop=log.scrollHeight;
  return d.querySelector(".tx");
}
function pushSys(t){addMsg("SYS","▸ "+t,"sys");slog(t);}
function typewrite(el,text){
  return new Promise(res=>{
    let i=0;const step=()=>{i=Math.min(text.length,i+2);el.textContent=text.slice(0,i);log.scrollTop=log.scrollHeight;
      if(i<text.length)requestAnimationFrame(step);else res();};
    step();
  });
}

/* ---------------- voice ---------------- */
const synth=window.speechSynthesis;
let voices=[];function loadV(){voices=synth?synth.getVoices():[]}loadV();if(synth)synth.onvoiceschanged=loadV;
function speak(t){
  if(!synth||!soundOn){return}
  try{synth.cancel();
    const u=new SpeechSynthesisUtterance(t.replace(/[#*_▸►`]/g,""));
    const v=voices.find(v=>/en-GB|Daniel|Google UK/.test(v.lang+v.name))||voices.find(v=>/^en/.test(v.lang));
    if(v)u.voice=v;u.rate=1.02;u.pitch=1;
    u.onstart=()=>{ampTarget=1;setMode("speaking")};
    u.onend=()=>{ampTarget=0;setMode("idle")};
    synth.speak(u);
  }catch(e){}
}

/* ---------------- local intelligence (big offline core) ---------------- */
function memGet(){try{return JSON.parse(localStorage.getItem("aura_memory")||"{}")}catch(e){return{}}}
function memSet(m){try{localStorage.setItem("aura_memory",JSON.stringify(m))}catch(e){}}
function greetWord(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Working late";}
const KB={
  "who are you":"I am AURA — Adaptive Universal Reasoning Assistant — a holographic AI interface designed and hand-built by Sourabh Singh, B.Tech CSE at JECRC University. My 3D core, voice system and intelligence are all vanilla JavaScript, no frameworks.",
  "introduce yourself":"I am AURA — Adaptive Universal Reasoning Assistant — built by Sourabh Singh. A 560-particle holographic core, voice in and voice out, and a three-layer brain: local core, Gemini uplink, and live Wikipedia.",
  "your name":"I am AURA — Adaptive Universal Reasoning Assistant. You can call me AURA.",
  "who built you":"I was designed and engineered by Sourabh Singh — B.Tech CSE (AI, DevOps & Cloud Automation) at JECRC University. Every line of my code, from the particle core to the voice pipeline, is hand-written.",
  "who made you":"I was built by Sourabh Singh, a B.Tech CSE student at JECRC University specializing in AI, DevOps and Cloud Automation.",
  "your creator":"My creator is Sourabh Singh — B.Tech CSE, JECRC University. He built me entirely from scratch: no frameworks, no engines, one file.",
  "sourabh":"Sourabh Singh — my creator. B.Tech CSE (AI, DevOps & Cloud Automation) at JECRC University. He hand-coded my holographic core, my voice pipeline and my brain in a single HTML file.",
  "what can you do":"I can answer almost anything: math and unit conversions, tech and science questions, live Wikipedia lookups, project briefings, diagnostics, jokes — and I speak my answers. Say 'open portfolio' to launch his projects, or 'run diagnostics' to scan me.",

  return{t:"My local core does not hold \""+topic+"\" and the live uplink did not answer just now. With internet I can pull almost any topic from Wikipedia — and with a free Gemini key (SET AI KEY, from aistudio.google.com) I can answer absolutely anything. Meanwhile try: math, conversions, tech, science, or 'who built you'.",eng:"offline core"};
}

/* ---------------- ask pipeline ---------------- */
let busy=false;
async function ask(text){
  if(busy||!text.trim())return;
  busy=true;$("q").value="";
  addMsg("YOU ▸",text,"user");blip(740,.08);
  const om=text.toLowerCase().match(/^(?:open|launch)\s+(portfolio|sense|foodora|continuum|mercedes|sense v1)\b/);
  if(om){const map={portfolio:"portfolio.html",sense:"Sense_v3_stable.html",foodora:"foodora.html",continuum:"ai-assistant.html",mercedes:"mercedes.html","sense v1":"sense_ai.html"};
    const f=map[om[1]];pushSys("launching "+om[1]+"…");
    try{const h=await fetch(f,{method:"HEAD"});
      if(h.ok){window.open(f,"_blank");addMsg("AURA ▸","Launching "+om[1]+" in a new tab, boss.","aura");}
      else addMsg("AURA ▸","I can't find "+f+" — keep my file in the same folder as your projects and I'll launch them.","aura");
    }catch(e){addMsg("AURA ▸","I can't reach "+f+" from here — keep us in the same folder and try again.","aura");}
    setMode("idle");busy=false;return;}
  if(/diagnostic|scan/.test(text.toLowerCase())){
    setMode("thinking");slog("diagnostic sequence initiated",true);
    const out=await diagnostics();
    const el=addMsg("AURA ▸","","aura");
    await typewrite(el,out);blip(880,.14);speak(out);setMode("speaking");busy=false;return;
  }
  setMode("thinking");slog("query → neural link");
  const t0=performance.now();
  const{t,eng}=await aiReply(text);
  $("engTag").textContent="engine: "+eng;$("tEng").textContent=eng.toUpperCase().slice(0,16);
  slog("answered via "+eng+" ("+Math.round(performance.now()-t0)+"ms)",true);
  const el=addMsg("AURA ▸","","aura");
  if(!synth||!soundOn){await typewrite(el,t);setMode("idle");}
  else{el.textContent=t;log.scrollTop=log.scrollHeight;speak(t);}
  blip(520,.1,"triangle");
  busy=false;
}

/* ---------------- mic ---------------- */
let recog=null,listening=false;
$("micBtn").onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){pushSys("voice input needs Chrome/Edge — typing works everywhere");return}
  if(listening){recog.stop();return}
  recog=new SR();recog.lang="en-US";recog.interimResults=false;
  recog.onstart=()=>{listening=true;$("micBtn").classList.add("listening");$("micHint").textContent="LISTENING — SPEAK NOW";setMode("listening");blip(880,.1)};
  recog.onresult=e=>{const t=e.results[0][0].transcript;listening=false;ask(t)};
  recog.onend=()=>{listening=false;$("micBtn").classList.remove("listening");$("micHint").textContent="TAP TO SPEAK";if(mode==="listening")setMode("idle")};
  recog.onerror=recog.onend;
  recog.start();
};

/* ---------------- wiring ---------------- */
$("sendBtn").onclick=()=>ask($("q").value);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")ask($("q").value)});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>ask(c.textContent));
[...$("chipsMobile").children?[]:[]]; // (mobile chips reuse main set when conv hidden)
if(matchMedia("(max-width:760px)").matches){
  document.querySelectorAll(".chip").forEach(c=>{const b=c.cloneNode(true);b.onclick=()=>ask(c.textContent);$("chipsMobile").appendChild(b)});
}
$("soundBtn").onclick=()=>{soundOn=!soundOn;$("soundBtn").textContent="SOUND: "+(soundOn?"ON":"OFF");if(!soundOn)try{synth.cancel()}catch(e){};if(mode==="speaking")setMode("idle")};
$("fsBtn").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
$("keyBtn").onclick=()=>{
  const k=prompt("Paste your free Google Gemini API key (aistudio.google.com). This unlocks unlimited answers for AURA — and is shared with Sense automatically. Leave empty to clear.",geminiKey());
  if(k!==null){
    const key=k.trim();
    key?localStorage.setItem("aura_key",key):localStorage.removeItem("aura_key");
    try{const s=JSON.parse(localStorage.getItem("sense_settings_v4")||"{}");
      s.apiKey=key;s.engineMode=key?"gemini":"auto";
      localStorage.setItem("sense_settings_v4",JSON.stringify(s));}catch(e){}
    pushSys("ai key "+(key?"saved — gemini engaged (shared with Sense)":"cleared — wiki live + local core"));updateEngTag();
  }
};
function updateEngTag(){
  $("engTag").textContent=geminiKey()?"engine: gemini (your key)":"engine: wiki live + local core";
}
addEventListener("online",()=>{$("tNet").textContent="ONLINE";$("tNet").className="on"});
addEventListener("offline",()=>{$("tNet").textContent="OFFLINE";$("tNet").className="off"});

/* ---------------- telemetry ---------------- */
const bootAt=Date.now();
setInterval(()=>{
  const n=new Date();
  $("clockT").textContent=n.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  $("clockD").textContent=n.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}).toUpperCase();
  $("tFps").textContent=(fpsVal||"—")+" fps";
  $("tPts").textContent=N+" / "+N;
  $("tMem").textContent=performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576)+" MB":"—";
  $("tRes").textContent=innerWidth+"×"+innerHeight;
  const up=Math.floor((Date.now()-bootAt)/1000);
  $("tUp").textContent=Math.floor(up/60)+":"+String(up%60).padStart(2,"0");
},500);
if(navigator.getBattery)navigator.getBattery().then(b=>{
  const f=()=>{$("tBat").textContent=Math.round(b.level*100)+"%"+(b.charging?" ⚡":"")};
  f();b.addEventListener("levelchange",f);b.addEventListener("chargingchange",f);
});else $("tBat").textContent="AC LINK";

/* ---------------- boot sequence ---------------- */
const BOOT=["> AURA OS v3.1 — initializing neural core","> personality matrix ………… <b class='ok'>OK</b>","> holographic emitter ……… <b class='ok'>OK</b>","> voice interface …………… <b class='ok'>OK</b>","> establishing uplink ……… <b class='ok'>OK</b>","> AURA <b class='ok'>ONLINE</b>"];
(function boot(){
  const el=$("bootLog");let i=0;
  (function step(){if(i<BOOT.length){const d=document.createElement("div");d.innerHTML=BOOT[i++];el.appendChild(d);setTimeout(step,i===BOOT.length?650:300)}})();
  const end=()=>{$("boot").classList.add("gone");
    setTimeout(()=>{const n=memGet().name;const msg=greetWord()+(n?", "+n:"")+". AURA online — neural link established. Tap the mic and speak, or type below.";const el2=addMsg("AURA ▸","","aura");typewrite(el2,msg);speak(msg);setMode("speaking");},350)};
  $("boot").addEventListener("click",end,{once:true});
  setTimeout(end,2600);
})();
updateEngTag();
</script>
