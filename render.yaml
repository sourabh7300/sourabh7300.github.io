services:
  - type: web
    name: aura-secure-backend
    runtime: node
    plan: free
    rootDir: aura-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you paste the key in the Render dashboard — never in this file
      - key: RATE_LIMIT
        value: "30"
      # Optional hardening:
      # - key: SECRET
      #   sync: false
      # - key: REQUIRE_SECRET
      #   value: "1"
