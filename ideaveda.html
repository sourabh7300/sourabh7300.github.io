ural/urban dono categories me available. KVIC/state KVIC office se apply hota hai.",apply:"KVIC / kviconline.gov.in",url:"kviconline.gov.in"},{id:"surya",name:"PM Surya Ghar",type:"Subsidy",amount:"Up to \u20B978k",rate:"Direct benefit",industries:["Energy"],detail:"Rooftop solar installations pe direct subsidy. Installers DISCOM empanelment ke through clients ko help karte hain \u2014 yahi aapka service angle hai.",apply:"pmsuryaghar.gov.in",url:"pmsuryaghar.gov.in"},{id:"standup",name:"Stand-Up India",type:"Loan",amount:"\u20B910L \u2013 1Cr",rate:"Subsidized",industries:["Food","Retail","Technology","Fitness","Agriculture","Energy"],detail:"SC/ST aur women entrepreneurs ke liye greenfield projects me loan. Trading, manufacturing aur services sab covered.",apply:"Standupmitra.in",url:"standupmitra.in"},{id:"nabard",name:"NABARD Agri Schemes",type:"Subsidy + Loan",amount:"25\u201350% of project",rate:"Varies",industries:["Agriculture","Food"],detail:"Dairy/agri-processing units ke liye capital subsidy + refinance. State dairy development boards ke through. Value-addition projects ko priority.",apply:"State dairy board / NABARD",url:"nabard.org"},{id:"cgtsme",name:"CGTMSE Credit Guarantee",type:"Guarantee",amount:"Collateral cover",rate:"Free\u2013low fee",industries:["Food","Education","Retail","Services","Technology","Fitness","Events","Agriculture","Energy"],detail:"Bank loan pe collateral-free guarantee cover. Agar Mudra se zyada chahiye to bank se CGTMSE-backed loan maango.",apply:"Through your bank",url:"cgtmse.in"},{id:"startup-india",name:"Startup India Registration",type:"Tax benefits",amount:"Tax holiday + funds",rate:"3-yr tax exemption",industries:["Technology","Retail","Food","Energy","Education"],detail:"DPIIT recognition \u2014 3 saal tax holiday, self-certification compliance, patent fee rebate, aur government tender me relaxation.",apply:"startupindia.gov.in",url:"startupindia.gov.in"}];ze=["Mumbai","Delhi NCR","Bengaluru","Hyderabad","Pune","Jaipur","Indore","Ahmedabad","Surat","Lucknow","Patna","Kota","Chandigarh","Nagpur","Kochi","Udaipur","Anand","Ludhiana","Gurugram"],ra={cooking:"Cooking",teaching:"Teaching",creative:"Creative",marketing:"Marketing",tech:"Tech",ops:"Operations",fitness:"Fitness",care:"Animal care"},Ee=[{id:"reg",title:"Business Registration Guide",cat:"Basics",mins:8,intro:"Kaunsa structure kab \u2014 aur registration actually kaise hoti hai. Har naye founder ka pehla confusion.",sections:[["Proprietorship \u2014 sabse simple","Sirf ek banda, koi partner nahi. Koi registration process nahi hota \u2014 current account + GST (jab zaroorat ho) se aap legally 'business' ban jate hain. 90% chhote businesses yahi hain. Liability unlimited hai: business ka debt aapka personal debt hai. Udyam (MSME) registration free hai, 10 minute ka kaam \u2014 loan aur subsidies me madad karta hai."],["Partnership / LLP","2+ log ho to partnership deed (\u20B92\u20135k notary pe) banao. LLP (Limited Liability Partnership) thoda mehenga hai (\u20B98\u201315k) lekin personal assets protected rehte hain \u2014 partners sirf apne agreed share tak liable hain. Friends/family ke saath business ho to LLP ya clear deed zaroori hai \u2014 90% partnerships isiliye tootte hain ki likha kuch nahi tha."],["Pvt Ltd \u2014 kab chahiye","Investors lene ho, ESOP dena ho, ya serious liability protection chahiye \u2014 tabhi Pvt Ltd (\u20B915\u201325k setup + \u20B915\u201330k/year compliance). Early stage me zaroori nahi \u2014 D2C ya tech startup ho to seed round se pehle Pvt Ltd me convert kar sakte ho."],["Practical order","Day 1: Udyam (free, instant) \u2192 GST sirf tab jab turnover \u20B920L+ ho ya e-commerce/interstate sale ho \u2192 FSSAI food ho to (\u20B9100\u20132000, 7 din) \u2192 Trade license municipal se (\u20B92\u20135k). Trademark \u20B94.5k se \u2014 brand banana ho to year 1 me hi file kar do."]]},{id:"gst",title:"GST & Taxes \u2014 Practical Guide",cat:"Finance",mins:9,intro:"GST ka darr sabse zyada hai \u2014 actual me simple hai. Kya kab lagana hai aur kaise bacho penalty se.",sections:[["GST kab lagta hai","Service business: \u20B920L turnover se zyada ho. Goods (physical sale): \u20B940L (\u20B920L special states). E-commerce pe sale (Amazon/Meesho) \u2014 turant chahiye, threshold nahi. Interstate sale \u2014 turant. Restaurant/hotel \u2014 turant. Baaki cases me wait kar sakte ho, turnonver cross hone tak."],["Registration process","gst.gov.in pe Aadhaar + PAN + bank + address proof. Free hai, agent \u20B91\u20133k lega mostly. 3\u20137 working days me number mil jata hai. Composition scheme (\u20B91.5Cr tak) \u2014 quarterly filing, no input credit, simple rates (1% traders, 5% restaurants). Chhote business ke liye composition best hai."],["Filing discipline","Monthly GSTR-1 (sale report) + GSTR-3B (summary+tax). Late fee \u20B950/day, max \u20B95000. Ek miss = \u20B95k+. Calendar reminder lagao ya CA ko \u20B9500\u20131500/month do jo handle kare. Composition me sirf quarterly \u2014 kaafi easy."],["Input tax credit (ITC)","Khareedari pe diya GST karsaat me minus ho jata hai. Har kharche ki GST invoice uthao aur rakho \u2014 machinery, rent, raw material \u2014 ye directly tax bachata hai. Regular scheme me ITC hi asli fayda hai."],["Personal vs business tax","Profit proprietorship me aapki income me ginta hai \u2014 slab rate lagega (\u20B93L tak free, upar 5\u201330%). Expenses (rent, salary, travel) business se likho \u2014 taxable profit ghat jata hai. Khata bahar rakhna = disasters ka recipe."]]},{id:"funding",title:"Funding \u2014 Loan se Seed Tak",cat:"Finance",mins:10,intro:"Paisa kahan se aata hai \u2014 aur aapko kis stage me kaunsa paisa chahiye.",sections:[["Stage 0: Apna paisa","6\u201312 mahine ka kharcha apne paas rakho, phir business start karo. Blended approach best hai: 50% apna, 50% borrowed \u2014 risk bhi managed, growth bhi."],["Govt loans (sabse accessible)","Mudra: \u20B950k\u201310L, collateral-free, 8\u201312%. PMEGP: project pe 15\u201335% subsidy (ye FREE money hai, loan ke saath). Stand-Up India: SC/ST/women ke liye \u20B910L\u20131Cr. JanSamarth portal pe sab ek jagah \u2014 yeh #1 option hai pehle business ke liye."],["Bank loans (practical reality)","Bank bina collateral ke loan nahi deta, aur business plan toh sunta bhi nahi \u2014 CGTMSE guarantee cover maango (sarkar aapki guarantee deta hai, aapko free/cheap milti hai). CIBIL 750+ rakho, 6 mahine ka bank statement clean rakho. Rejection normal hai \u2014 3\u20134 banks try karo."],["Angel investors \u2014 kab aur kaise","Sirf scalable businesses (tech, D2C, franchise model) ke liye. 100 customers proof hone ke baad hi baat karo, sirf idea pe nahi. \u20B95\u201325L ke rounds me equity 10\u201325% jaata hai. Indian networks: Lead Angels, LetsVenture, Titanium (tier-2 focus)."],["Avoid these traps","Credit card pe business start (24\u201340% interest = death spiral). Loan app se paisa (legal hell). 42% equity pehle round me dena (founder ka motivation hi khatam). Borrowed paisa fixed costs (interiors, gadgets) pe udana."]]},{id:"pricing",title:"Pricing & Unit Economics",cat:"Growth",mins:8,intro:"90% chhote businesses isliye marte hain ki unka price galat hai. Yahan framework hai.",sections:[["Cost-plus ka trap","'\u20B9100 cost + \u20B930 profit = \u20B9130' \u2014 galat. Fixed costs (rent, salary, utilities) per unit me bhi add hote hain. Agar monthly fixed \u20B960k hai aur 100 units bechte ho, to har unit pe \u20B9600 extra cogena padega. True cost nahi pata to price galat pakka."],["Break-even formula","Fixed costs \xF7 (price \u2212 variable cost) = break-even units/month. \u20B960k fixed, margin per unit \u20B9200 \u2192 300 units/month bas taakne ke liye. Har pricing decision se pehle ye number nikaalo."],["Value-based pricing","Customer ko jo value mil rahi hai us pe price karo, cost pe nahi. Bridal makeup ki 'cost' \u20B9500 hai, value \u20B915,000+ (shaadi!). Same product, same cost \u2014 positioning change, 3x price. Premium segment me competition kam hota hai."],["Psychology tactics","\u20B9999 > \u20B91000 (left digit effect). 3-tier pricing (Basic \u20B9500 / Standard \u20B9800 / Premium \u20B91500) \u2014 log middle ya premium choose karte hain. Anchoring: pehle mehenga dikhaao, phir asli offer. '\u20B9100/course' vs '\u20B91,200/year' \u2014 annual framing zyada convert karta hai."],["Raise prices \u2014 yes, really","Happy customers ke saath 10\u201315% hike normally safe hai. 10% price hike = 100% profit growth (margin me seedha jata hai). Volume sasta dene ke chakkar me mat girna \u2014 discount customers sabse demanding aur least loyal hote hain."]]},{id:"marketing",title:"Zero-Budget Marketing Playbook",cat:"Growth",mins:9,intro:"\u20B90 marketing budget pe pehle 100 customers kaise milte hain \u2014 field-tested tactics.",sections:[["WhatsApp groups = free distribution","Aapke area ke har group (society, market, parents, community) \u2014 yeh free audience hai. Direct spam nahi \u2014 value pehle: tips, offers, helpful answers. Status pe daily presence \u2014 500 contacts \xD7 daily status = free billboard."],["Google My Business \u2014 30 min setup","GMB listing free hai, local search me aapko customers diye deti hai. Photos regular daalo, review maango har happy customer se. 4.5+ rating wala business 3x zyada call aata hai. Yeh sabse underrated free tool hai."],["Content > Ads (pehle 6 mahine)","Daily 1 Reel/post apne work ka \u2014 before-after, process, customer stories. Volume se frequency better hai \u2014 30 posts/3 mahine hamesha 5 viral posts/3 mahine se zyada growth deta hai. Ek platform master karo, baaki repurpose."],["Referral engine","Har customer ko 'friend refer karo, dono ko \u20B9100/10% milega' \u2014 1 happy customer 2\u20133 laata hai. Hamesha kaho, har delivery ke saath card/QR do. Free hai aur best quality leads deta hai."],["Micro-influencers","50k\u2013200k local followers wale \u20B92\u201310k me shoutout karte hain (ya free product). Mega influencers ki jagah 5 micro \u2014 same budget, 5x trust. Local foodie/lifestyle pages tier-2 me kaafi sasta kaam karte hain."],["Partnerships > ads","Gym + nutritionist, salon + boutique, coaching + stationery \u2014 non-competing businesses ek hi customer pe share karo. Commission per lead \u2014 zero advance, pure performance. Win-win-win."]]},{id:"customers",title:"Pehle 100 Customers",cat:"Growth",mins:7,intro:"Sabse hard part \u2014 sabse simple process. Manual, dirty, effective.",sections:[["Week 1\u20132: 20 warm contacts","Phone contacts me jo bhi relevant banda hai \u2014 message bhejo personally (copy-paste nahi), 'main ye start kar raha hoon, aapko try karoge?' 100 contacts me 20\u201330 haa bolenge, 5\u201310 real customers banenge. Yeh 100-customer journey ka seedha 20% hai."],["Manual > Marketing (early)","Ads tab tak nahi jab 20 happy manual customers na ho. Manual se aata hai: pricing data, objections, real feedback, testimonials. In sab ke bina ads = paisa jalana."],["Objections hi teacher hai","Har 'nahi' ke peeche reason note karo: mehenga / time nahi / aage dekhenge. 30 baar sunne ke baad aapka pitch khud upgrade ho jata hai. Ye data kisi consultant me nahi milta \u2014 free hai."],["Testimonials jamao","Har happy customer se 2-line review + photo/video maango. 10 testimonials = future ke saare ads ka backbone. Log strangers ko nahi, evidence ko believe karte hain."],["Dhyan: retention > acquisition","Naya customer 5x mehenga hai existing se. Pehle 100 me se 30 ko retain karna = next 100 free me. Reminder system, loyalty perks, personal touch \u2014 sab sasta hai."]]},{id:"legal",title:"Legal & Compliance Basics",cat:"Basics",mins:7,intro:"Boring cheez jo 5 minute me padh ke laakhon bacha sakti hai.",sections:[["Agreements likho, bharoso mat","Co-founder, partner, key vendor, landlord \u2014 sab ke saath likha hua ho. \u20B93\u20138k me local lawyer se template. Yaad rakho: 'baat ki thi' court me nahi chalti. Partnership deed me exit clause zaroori hai \u2014 koi chhod de to kya hoga."],["Payment terms advance me","50% advance standard hai India me bhi. Cheque/UPI terms invoice pe likho, due date + 18% late fee. Client jo advance se bhaage, wo pehle hi bhaagna chahata tha."],["Insurance \u2014 3 must-haves","Public liability (customer aapki premises pe slip ho gaya), product liability (food poisoning, defect), staff/workmen insurance. Milake \u20B98\u201320k/year \u2014 ek case bhi bacha toh 10 saal ka premium recover."],["Labour compliance basics","1+ employee pe PF/ESI rules lag sakte hain (thresholds: ESI \u20B921k salary tak, PF 20+ employees). Chhote staff ke liye minimum wages ka dhyan \u2014 inspection rare hai par penalty heavy. Attendance + salary record digital rakho."],["Trademark \u2014 pehle hi file karo","Brand banne se pehle naam ki trademark search karo (ipindia.gov.in, free). \u20B94.5k government fee me file karo \u2014 6\u201312 mahine lagte hain isliye jaldi. Ek baar brand bana aur naam chheen gaya toh marketing dobara karni padegi \u2014 usse mehenga."]]},{id:"fail",title:"10 Wajah Jispe Startups Mar Jate Hain",cat:"Strategy",mins:8,intro:"Data-backed failure reasons \u2014 aur har ek ka antidote.",sections:[["1\u20132: No market need + wrong timing","42% startups isiliye marte hain ki koi unka product nahi chahta tha. Antidote: pehle 10 paying customers, phir product. 'Mujhe lagta hai' se bada koi data nahi \u2014 order book hi proof hai."],["3\u20134: Cash out + team issues","Founders 18 mahine ka runway soch ke 6 mahine me uda dete hain. Personal kharcha + business kharcha alag rakhna. Co-founder conflict: roles, equity, exit \u2014 sab day 1 pe likho."],["5: Outcompeted","Competition ka data maintain karo \u2014 unki pricing, reviews, weaknesses. 'Koi competitor nahi' usually matlab hai: market nahi hai. Competition hona proof hai market ka."],["6\u20137: Pricing/cost problems + poor product","Discount war me mat jao \u2014 quality se differentiate karo. Product launch ke baad improvement band = slow death. Monthly ek improvement cycle \u2014 sabse tez seekhne wala jeet-ta hai."],["8\u201310: Marketing myopia + ignoring customers + burn","Ek channel master karo (WhatsApp, IG, GMB \u2014 jo bhi) \u2014 'sab jagah presence' ka matlab 'kahin bhi nahi'. Customers ki baat suno \u2014 jo complaints 3 baar repeat ho, wo priority. Aur burn: luxury pehle saal me nahi \u2014 bootstrap mindset year 2 tak rakho."]]},{id:"scale",title:"Kab Aur Kaise Scale Karein",cat:"Strategy",mins:8,intro:"Growth ka formula: jab 3 signals milein, tabhi pedal dabao.",sections:[["3 signals of readiness","Signal 1 \u2014 demand aapko dhoondh rahi hai (repeat/referral bina push ke aa raha hai). Signal 2 \u2014 margins stable hain, 30%+ consistent. Signal 3 \u2014 aap khud operations se nikal sakte ho 2 din/week. Teeno hone tak scaling = accelerated loss."],["Formula-first hire","Pehla hire wo kaam jo aap \u20B9X me karte ho aur banda \u20B9X/2 me kar dega \u2014 aap apni time higher-value pe lagao. Delivery/sales pehle, admin baad me. Contractor > full-time jab uncertain ho."],["Standardize then multiply","Jo ek location/team pe chal raha hai \u2014 process document banao (5\u201310 page SOP chalata hai), phir hi dusra location. 'Main hi kar leta hoon' mindset scaling ki dushman #1 hai."],["Second revenue line","Same customer, naya product \u2014 cafe + catering, coaching + online course, salon + product line. Acquisition cost zero (existing customers), margin better. Core strong hone ke baad hi, warna focus tootega."],["Cash buffer rule","Scale karte waqt 6 mahine ka fixed-cost buffer alag rakho \u2014 expansion ka output 3\u20136 mahine late aata hai, kharcha immediate hota hai. Is buffer ke bina scaling = Russian roulette."]]},{id:"mindset",title:"Founder Mindset & Time Management",cat:"Strategy",mins:6,intro:"Business skills ke baad ye \u2014 jeetne aur jeetne ka asli difference.",sections:[["Energy management > time management","Apne 3 peak hours identify karo (mostly subah) \u2014 us me sales/product ka kaam. Low energy me admin/emails. 60 focused minutes > 6 distracted ghante. Founder ka output hi business ka ceiling hai."],["20 customers rule","Har hafte 20 customers/prospects se baat karo \u2014 founder ko hi karna chahiye, koi aur nahi. Market ka pulse yahi aata hai, dashboards me nahi. Growth flat lage toh ye habit hi restart button hai."],["Comparison trap","Instagram pe sab zyada successful dikhte hain. Asli comparison: aap khud 90 din pehle kahan the. Quarterly review karo \u2014 revenue, customers, skills. Compounding chhoti dikhti hai par hoti rehti hai."],["Sunk cost se nikalna","Jo idea 12 mahine me validation nahi de paya, use band karna bhi strategy hai. Pivot dar nahi, feedback hai. Business band karna = failure nahi, jaldbaazi me aur 2 saal udana = failure hai."],["Health = business asset","Founder ki neend 6 mahine kam = decisions 30% worse. Sleep, movement, weekly off \u2014 non-negotiable. Business marathon hai, sprint nahi \u2014 jo bhaag ke start karta hai wo mid pe khatam hota hai."]]}],X="#818cf8",ce=a=>a>=60?"#34d399":a>=45?"#fbbf24":"#fb7185",ye={background:"#131316",border:"1px solid #26262b",borderRadius:8,fontSize:12,color:"#d4d4d8"},la={search:e.createElement(e.Fragment,null,e.createElement("circle",{cx:"11",cy:"11",r:"8"}),e.createElement("line",{x1:"21",y1:"21",x2:"16.65",y2:"16.65"})),pin:e.createElement(e.Fragment,null,e.createElement("path",{d:"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"}),e.createElement("circle",{cx:"12",cy:"10",r:"3"})),heart:e.createElement("path",{d:"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"}),compare:e.createElement(e.Fragment,null,e.createElement("path",{d:"M8 3 4 7l4 4"}),e.createElement("path",{d:"M4 7h16"}),e.createElement("path",{d:"M16 21l4-4-4-4"}),e.createElement("path",{d:"M20 17H4"})),book:e.createElement(e.Fragment,null,e.createElement("path",{d:"M4 19.5A2.5 2.5 0 0 1 6.5 1
