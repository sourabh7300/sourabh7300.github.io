name: AURA — sync build + verify root site

# WHY THIS CHANGED (26 Oct 2026)
# The old job fetched https://raw.githubusercontent.com/sourabh7300/aura/main/aura.html
# with a plain curl. That repo is PRIVATE, so anonymous raw access always returned 404
# and every run failed on the first step ("Fetch latest AURA build"), which is what
# filled the inbox every 15 minutes. A private repo can only be read with a token, so:
#   • with the AURA_SYNC_TOKEN secret → the build is fetched with auth, mirrored and
#     verified (fully automatic, exactly as intended before);
#   • without it → the job SKIPS the copy instead of failing and only verifies what is
#     actually published, so a dark/garbled live page still turns this run red.
on:
  push:
    branches: [main]
  schedule:
    # hourly: the 15-minute cron bought nothing (GitHub throttles it anyway) and every
    # failure mailed the owner. One check an hour is enough to catch a dark site.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aura-sync
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the AURA build (private source repo)
        id: fetch
        env:
          AURA_SYNC_TOKEN: ${{ secrets.AURA_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AURA_SYNC_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=AURA sync skipped::sourabh7300/aura is private and the AURA_SYNC_TOKEN secret is not set, so this run only verifies the published site. AURA/deploy.js mirrors the build on every local deploy; add the secret to make this job copy it too."
            exit 0
          fi

          # cache-bust: raw.githubusercontent edge caches can serve a stale blob right
          # after a push, which would make this job think it is already in sync.
          curl -fsSL --retry 3 --retry-delay 5 --max-time 120 \
            -H "Authorization: Bearer ${AURA_SYNC_TOKEN}" \
            -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
            -o fetched.html \
            "https://raw.githubusercontent.com/sourabh7300/aura/main/aura.html?cb=$(date -u +%s%N)"

          size=$(wc -c < fetched.html)
          echo "fetched ${size} bytes"
          [ "$size" -gt 900000 ] || { echo "::error::truncated download (${size} bytes) — token may be invalid or the file moved"; exit 1; }
          grep -qi '<title>AURA' fetched.html || { echo "::error::fetched file is not the AURA app"; exit 1; }
          tail -c 4096 fetched.html | grep -qi '</html>' || { echo "::error::incomplete HTML document"; exit 1; }

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Mirror commit when different
        id: mirror
        if: steps.fetch.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # both published paths must carry the same build: /aura.html (portfolio card)
          # and /aura/aura.html + /aura/index.html (the advertised standalone URL).
          changed=false
          for target in aura.html aura/aura.html aura/index.html; do
            if ! cmp -s fetched.html "$target"; then cp fetched.html "$target"; changed=true; fi
          done
          if [ "$changed" = "false" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "root site already serves the latest AURA build"
            exit 0
          fi
          git config user.name "aura-mirror[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aura.html aura/aura.html aura/index.html
          git commit -m "Mirror AURA build: auto-sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "mirror commit pushed"

      - name: Rebuild Pages + verify live site
        if: steps.mirror.outputs.changed == 'true'
        run: |
          set -euo pipefail
          want=$(sha256sum aura.html | cut -d' ' -f1)
          # Pushes made with GITHUB_TOKEN do not fire the Pages build workflow, so ask
          # for a build explicitly. Both endpoints are best-effort: older repos expose
          # only one of them, and a 4xx here is not itself a failure.
          curl -sS -o /dev/null -w 'pages build API: %{http_code}\n' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
          for i in $(seq 1 30); do
            sleep 10
            live=$(curl -fsSL --max-time 30 "https://sourabh7300.github.io/aura.html?cb=$i" | sha256sum | cut -d' ' -f1 || echo none)
            echo "poll $i: live=$live want=$want"
            if [ "$live" = "$want" ]; then echo "✓ live site verified"; exit 0; fi
          done
          echo "::error::live site did not update within 5 minutes"
          exit 1

      - name: Published AURA pages must be complete documents
        run: |
          set -euo pipefail
          fail=0
          for url in \
            "https://sourabh7300.github.io/aura.html" \
            "https://sourabh7300.github.io/aura/aura.html" \
            "https://sourabh7300.github.io/aura/"; do
            body=$(mktemp)
            code=$(curl -sSL --retry 2 --max-time 60 -o "$body" -w '%{http_code}' "$url?verify=$(date -u +%s)" || echo 000)
            size=$(wc -c < "$body")
            echo "$url → HTTP $code · $size bytes"
            [ "$code" = "200" ] || { echo "::error::$url returned $code"; fail=1; }
            [ "$size" -gt 900000 ] || { echo "::error::$url is only $size bytes"; fail=1; }
            grep -qi '<title>AURA' "$body" || { echo "::error::$url is not the AURA app"; fail=1; }
            tail -c 4096 "$body" | grep -qi '</html>' || { echo "::error::$url is truncated"; fail=1; }
            rm -f "$body"
          done
          exit $fail

      - name: Backend API status (informational — keepalive owns the alert)
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' -m 90 https://aura-backend-jomj.onrender.com/health || echo 000)
            echo "attempt $i: GET /health → $code"
            if [ "$code" = "200" ]; then head -c 300 /tmp/health.json; echo; exit 0; fi
            sleep 20
          done
          echo "::warning::backend /health not answering right now (free tier may be cold) — see the Keep-alive workflow"
