<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continuum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141c;
    --surface:#181b26;
    --surface-raised:#1f2331;
    --border:#2a2f42;
    --text:#e9e7de;
    --text-dim:#9a9cae;
    --text-faint:#5f6377;
    --gold:#c9a227;
    --gold-dim:#8a7222;
    --error:#c76a5f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:15px;
    line-height:1.55;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns:260px 1fr;
    height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .brand{
    padding:22px 20px 16px 20px;
    border-bottom:1px solid var(--border);
  }
  .brand-mark{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:22px;
    color:var(--text);
    letter-spacing:0.2px;
  }
  .brand-sub{
    color:var(--text-faint);
    font-size:12px;
    margin-top:3px;
  }
  .new-chat-btn{
    margin:14px 16px 6px 16px;
    padding:10px 14px;
    background:transparent;
    border:1px solid var(--gold-dim);
    color:var(--gold);
    border-radius:var(--radius);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
    text-align:left;
  }
  .new-chat-btn:hover{
    background:rgba(201,162,39,0.08);
    border-color:var(--gold);
  }
  .section-label{
    padding:16px 20px 6px 20px;
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:0.3px;
  }
  .chat-list{
    flex:1;
    overflow-y:auto;
    padding:2px 10px 10px 10px;
  }
  .chat-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:9px 10px;
    border-radius:8px;
    cursor:pointer;
    color:var(--text-dim);
    font-size:13.5px;
    margin-bottom:2px;
  }
  .chat-item:hover{background:var(--surface-raised);}
  .chat-item.active{background:var(--surface-raised); color:var(--text);}
  .chat-item .title{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1;
  }
  .chat-item .del{
    opacity:0;
    color:var(--text-faint);
    font-size:15px;
    line-height:1;
    padding:2px 4px;
  }
  .chat-item:hover .del{opacity:1;}
  .chat-item .del:hover{color:var(--error);}
  .empty-hint{
    color:var(--text-faint);
    font-size:12.5px;
    padding:8px 10px;
  }

  .templates-toggle{
    padding:12px 20px;
    border-top:1px solid var(--border);
    color:var(--text-faint);
    font-size:12.5px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .templates-toggle:hover{color:var(--text-dim);}

  /* ---------- MAIN ---------- */
  .main{
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
  }
  .thread{
    flex:1;
    overflow-y:auto;
    padding:30px 0 10px 0;
  }
  .thread-inner{
    max-width:700px;
    margin:0 auto;
    padding:0 24px;
  }
  .welcome{
    max-width:560px;
    margin:10vh auto 0 auto;
    text-align:center;
    padding:0 24px;
  }
  .welcome h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size:30px;
    color:var(--text);
    margin:0 0 10px 0;
  }
  .welcome p{
    color:var(--text-dim);
    font-size:14px;
    margin:0;
  }
  .msg{
    margin-bottom:26px;
    display:flex;
    flex-direction:column;
  }
  .msg .role{
    font-size:11.5px;
    color:var(--text-faint);
    margin-bottom:6px;
    font-family:'IBM Plex Mono', monospace;
  }
  .msg.user .role{color:var(--gold-dim);}
  .msg .bubble{
    color:var(--text);
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg.user .bubble{
    color:#d8d5c8;
  }
  .msg .bubble p{margin:0 0 12px 0;}
  .msg .bubble p:last-child{margin-bottom:0;}
  .msg.error .bubble{
    color:var(--error);
    font-size:13.5px;
  }
  .typing{
    display:inline-flex;
    gap:4px;
    padding:4px 0;
  }
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--text-faint);
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:0.2s;}
  .typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{
    0%,80%,100%{opacity:0.25;}
    40%{opacity:1;}
  }

  .composer{
    border-top:1px solid var(--border);
    background:var(--ink);
    padding:16px 24px 20px 24px;
  }
  .composer-inner{
    max-width:700px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:8px 8px 8px 16px;
  }
  .composer-inner:focus-within{border-color:var(--gold-dim);}
  textarea{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14.5px;
    line-height:1.5;
    max-height:180px;
    padding:8px 0;
  }
  textarea::placeholder{color:var(--text-faint);}
  .send-btn{
    background:var(--gold);
    border:none;
    color:#1a1608;
    width:34px;
    height:34px;
    border-radius:9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:opacity 0.15s;
  }
  .send-btn:disabled{opacity:0.35; cursor:default;}
  .send-btn:hover:not(:disabled){opacity:0.85;}
  .mic-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    width:34px;
    height:34px;
    border-radius:9px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:background 0.15s, border-color 0.15s, color 0.15s;
  }
  .mic-btn:hover{border-color:var(--gold-dim); color:var(--gold);}
  .mic-btn.listening{
    background:rgba(199,106,95,0.15);
    border-color:var(--error);
    color:var(--error);
    animation:pulse 1.4s infinite;
  }
  .mic-btn.unsupported{opacity:0.3; cursor:default;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(199,106,95,0.35);}
    50%{box-shadow:0 0 0 6px rgba(199,106,95,0);}
  }
  .composer-foot{
    max-width:700px;
    margin:8px auto 0 auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--text-faint);
    font-size:11.5px;
  }
  .foot-right{
    display:flex;
    align-items:center;
    gap:14px;
    margin-left:auto;
  }
  .speak-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
    user-select:none;
  }
  .speak-toggle input{
    accent-color:var(--gold);
    cursor:pointer;
  }
  .active-template-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--gold);
    cursor:pointer;
  }
  .active-template-pill .x{color:var(--text-faint); margin-left:2px;}

  /* ---------- TEMPLATES PANEL ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,11,16,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    width:480px;
    max-width:90vw;
    max-height:78vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .panel-head{
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .panel-head h2{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:18px;
    margin:0;
  }
  .panel-close{
    color:var(--text-faint);
    cursor:pointer;
    font-size:18px;
    background:none;
    border:none;
  }
  .panel-body{
    padding:16px 20px;
    overflow-y:auto;
    flex:1;
  }
  .tpl-item{
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .tpl-item.active-tpl{border-color:var(--gold-dim);}
  .tpl-name{font-weight:500; font-size:14px; margin-bottom:4px;}
  .tpl-prompt{color:var(--text-dim); font-size:12.5px; margin-bottom:10px; white-space:pre-wrap;}
  .tpl-actions{display:flex; gap:10px; font-size:12px;}
  .tpl-actions button{
    background:none; border:none; cursor:pointer;
    color:var(--text-faint); padding:0; font-family:inherit;
  }
  .tpl-actions button:hover{color:var(--gold);}
  .tpl-actions button.danger:hover{color:var(--error);}
  .new-tpl{
    border-top:1px solid var(--border);
    padding:16px 20px;
  }
  .new-tpl input, .new-tpl textarea{
    width:100%;
    background:var(--surface-raised);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:13px;
    padding:9px 11px;
    margin-bottom:8px;
    outline:none;
  }
  .new-tpl textarea{resize:vertical; min-height:60px;}
  .new-tpl input:focus, .new-tpl textarea:focus{border-color:var(--gold-dim);}
  .save-tpl-btn{
    background:var(--gold);
    border:none;
    color:#1a1608;
    padding:8px 16px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:500;
    cursor:pointer;
  }
  .save-tpl-btn:disabled{opacity:0.35;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-mark">Continuum</div>
      <div class="brand-sub">a place that remembers</div>
    </div>
    <button class="new-chat-btn" id="newChatBtn">+ New conversation</button>
    <div class="section-label">History</div>
    <div class="chat-list" id="chatList"></div>
    <div class="templates-toggle" id="templatesToggle">
      <span>Saved instructions</span>
      <span id="tplCount"></span>
    </div>
  </div>

  <div class="main">
    <div class="thread" id="thread">
      <div class="welcome" id="welcome">
        <h1>Tell me what you need done.</h1>
        <p>Tap the mic and speak your task, or type below. I'll answer out loud and keep the thread saved.</p>
      </div>
      <div class="thread-inner" id="threadInner" style="display:none;"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <button class="mic-btn" id="micBtn" title="Speak">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <textarea id="input" placeholder="Speak or type a task..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="Send">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="composer-foot">
        <span id="activeTemplateArea"></span>
        <span class="foot-right">
          <label class="speak-toggle" id="speakToggleLabel">
            <input type="checkbox" id="speakToggle"> Speak replies
          </label>
          <span id="statusArea"></span>
        </span>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="tplOverlay">
  <div class="panel">
    <div class="panel-head">
      <h2>Saved instructions</h2>
      <button class="panel-close" id="tplClose">&times;</button>
    </div>
    <div class="panel-body" id="tplList"></div>
    <div class="new-tpl">
      <input type="text" id="tplNameInput" placeholder="Name (e.g. Concise editor)" maxlength="60">
      <textarea id="tplPromptInput" placeholder="Instructions to apply to new conversations..."></textarea>
      <button class="save-tpl-btn" id="tplSaveBtn">Save instruction</button>
    </div>
  </div>
</div>

<script>
(function(){
  const state = {
    chats: {},          // id -> {id,title,messages:[{role,content}],createdAt,updatedAt,templateId}
    chatOrder: [],
    templates: {},      // id -> {id,name,prompt}
    templateOrder: [],
    activeChatId: null,
    sending: false
  };

  const el = {
    chatList: document.getElementById('chatList'),
    thread: document.getElementById('thread'),
    threadInner: document.getElementById('threadInner'),
    welcome: document.getElementById('welcome'),
    input: document.getElementById('input'),
    sendBtn: document.getElementById('sendBtn'),
    statusArea: document.getElementById('statusArea'),
    activeTemplateArea: document.getElementById('activeTemplateArea'),
    newChatBtn: document.getElementById('newChatBtn'),
    micBtn: document.getElementById('micBtn'),
    speakToggle: document.getElementById('speakToggle'),
    templatesToggle: document.getElementById('templatesToggle'),
    tplOverlay: document.getElementById('tplOverlay'),
    tplClose: document.getElementById('tplClose'),
    tplList: document.getElementById('tplList'),
    tplNameInput: document.getElementById('tplNameInput'),
    tplPromptInput: document.getElementById('tplPromptInput'),
    tplSaveBtn: document.getElementById('tplSaveBtn'),
    tplCount: document.getElementById('tplCount')
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function setStatus(msg, isError){
    el.statusArea.textContent = msg || '';
    el.statusArea.style.color = isError ? 'var(--error)' : 'var(--text-faint)';
  }

  // ---------- PERSISTENCE ----------
  async function loadAll(){
    try{
      const idxRes = await safeGet('chat-index');
      const chatIds = idxRes ? JSON.parse(idxRes.value) : [];
      for(const id of chatIds){
        const r = await safeGet('chat:' + id);
        if(r){
          const chat = JSON.parse(r.value);
          state.chats[chat.id] = chat;
          state.chatOrder.push(chat.id);
        }
      }
      state.chatOrder.sort((a,b) => (state.chats[b].updatedAt||0) - (state.chats[a].updatedAt||0));

      const tplIdxRes = await safeGet('template-index');
      const tplIds = tplIdxRes ? JSON.parse(tplIdxRes.value) : [];
      for(const id of tplIds){
        const r = await safeGet('template:' + id);
        if(r){
          const t = JSON.parse(r.value);
          state.templates[t.id] = t;
          state.templateOrder.push(t.id);
        }
      }
    }catch(e){
      console.error('Load failed', e);
      setStatus('Could not load saved history', true);
    }
    renderChatList();
    renderTemplateList();
  }

  async function safeGet(key){
    try{
      return await window.storage.get(key, false);
    }catch(e){
      return null; // key not found or storage unavailable
    }
  }

  async function persistChat(chat){
    try{
      await window.storage.set('chat:' + chat.id, JSON.stringify(chat), false);
      if(!state.chatOrder.includes(chat.id)){
        state.chatOrder.unshift(chat.id);
      }
      await window.storage.set('chat-index', JSON.stringify(state.chatOrder), false);
    }catch(e){
      console.error('Save failed', e);
      setStatus('Could not save — changes may not persist', true);
    }
  }

  async function deleteChatStorage(id){
    try{
      await window.storage.delete('chat:' + id, false);
      state.chatOrder = state.chatOrder.filter(x => x !== id);
      await window.storage.set('chat-index', JSON.stringify(state.chatOrder), false);
    }catch(e){ console.error(e); }
  }

  async function persistTemplates(){
    try{
      await window.storage.set('template-index', JSON.stringify(state.templateOrder), false);
    }catch(e){ console.error(e); }
  }

  // ---------- CHAT LIST UI ----------
  function renderChatList(){
    el.chatList.innerHTML = '';
    if(state.chatOrder.length === 0){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'No conversations yet';
      el.chatList.appendChild(hint);
      return;
    }
    for(const id of state.chatOrder){
      const chat = state.chats[id];
      if(!chat) continue;
      const item = document.createElement('div');
      item.className = 'chat-item' + (id === state.activeChatId ? ' active' : '');
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = chat.title || 'New conversation';
      const del = document.createElement('div');
      del.className = 'del';
      del.textContent = '\u00d7';
      del.title = 'Delete';
      del.onclick = async (e) => {
        e.stopPropagation();
        delete state.chats[id];
        await deleteChatStorage(id);
        if(state.activeChatId === id){
          state.activeChatId = null;
          showWelcome();
        }
        renderChatList();
      };
      item.appendChild(title);
      item.appendChild(del);
      item.onclick = () => openChat(id);
      el.chatList.appendChild(item);
    }
  }

  function showWelcome(){
    el.welcome.style.display = 'block';
    el.threadInner.style.display = 'none';
    el.activeTemplateArea.textContent = '';
  }

  function openChat(id){
    state.activeChatId = id;
    el.welcome.style.display = 'none';
    el.threadInner.style.display = 'block';
    renderMessages();
    renderChatList();
    updateActiveTemplatePill();
  }

  function renderMessages(){
    const chat = state.chats[state.activeChatId];
    el.threadInner.innerHTML = '';
    if(!chat) return;
    for(const m of chat.messages){
      el.threadInner.appendChild(renderMessage(m));
    }
    el.thread.scrollTop = el.thread.scrollHeight;
  }

  function renderMessage(m){
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + m.role + (m.error ? ' error' : '');
    const role = document.createElement('div');
    role.className = 'role';
    role.textContent = m.role === 'user' ? 'you' : (m.error ? 'error' : 'continuum');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = m.content;
    wrap.appendChild(role);
    wrap.appendChild(bubble);
    return wrap;
  }

  function updateActiveTemplatePill(){
    const chat = state.chats[state.activeChatId];
    el.activeTemplateArea.innerHTML = '';
    if(chat && chat.templateId && state.templates[chat.templateId]){
      const t = state.templates[chat.templateId];
      const pill = document.createElement('span');
      pill.className = 'active-template-pill';
      pill.innerHTML = 'Using "' + escapeHtml(t.name) + '"<span class="x">&times;</span>';
      pill.onclick = () => {
        chat.templateId = null;
        persistChat(chat);
        updateActiveTemplatePill();
      };
      el.activeTemplateArea.appendChild(pill);
    }
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- NEW CHAT ----------
  el.newChatBtn.onclick = () => {
    const id = uid();
    const chat = { id, title: '', messages: [], createdAt: Date.now(), updatedAt: Date.now(), templateId: null };
    state.chats[id] = chat;
    openChat(id);
    el.input.focus();
  };

  // ---------- SENDING ----------
  el.input.addEventListener('input', () => {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 180) + 'px';
  });
  el.input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      handleSend();
    }
  });
  el.sendBtn.onclick = handleSend;

  async function handleSend(){
    const text = el.input.value.trim();
    if(!text || state.sending) return;

    if(!state.activeChatId){
      const id = uid();
      state.chats[id] = { id, title: '', messages: [], createdAt: Date.now(), updatedAt: Date.now(), templateId: null };
      state.activeChatId = id;
      el.welcome.style.display = 'none';
      el.threadInner.style.display = 'block';
    }
    const chat = state.chats[state.activeChatId];

    chat.messages.push({ role: 'user', content: text });
    if(!chat.title){
      chat.title = text.slice(0, 42) + (text.length > 42 ? '…' : '');
    }
    chat.updatedAt = Date.now();
    el.input.value = '';
    el.input.style.height = 'auto';
    renderMessages();
    renderChatList();
    persistChat(chat);

    state.sending = true;
    el.sendBtn.disabled = true;
    setStatus('Thinking...');

    const typingEl = document.createElement('div');
    typingEl.className = 'msg';
    typingEl.innerHTML = '<div class="role">continuum</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    el.threadInner.appendChild(typingEl);
    el.thread.scrollTop = el.thread.scrollHeight;

    try{
      const apiMessages = chat.messages.map(m => ({ role: m.role, content: m.content }));
      const body = {
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: apiMessages
      };
      if(chat.templateId && state.templates[chat.templateId]){
        body.system = state.templates[chat.templateId].prompt;
      }

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if(!response.ok){
        let detail = '';
        try{ detail = await response.text(); }catch(e){}
        throw new Error('Request failed (' + response.status + ')' + (detail ? ': ' + detail.slice(0,300) : ''));
      }
      const data = await response.json();
      if(data.error){
        throw new Error(data.error.message || JSON.stringify(data.error));
      }
      const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
      const replyText = textBlocks.join('\n\n') || '(No response text returned)';

      typingEl.remove();
      chat.messages.push({ role: 'assistant', content: replyText });
      chat.updatedAt = Date.now();
      renderMessages();
      persistChat(chat);
      setStatus('');
      speak(replyText);
    }catch(err){
      console.error(err);
      typingEl.remove();
      chat.messages.push({ role: 'assistant', content: 'Something went wrong reaching the model: ' + err.message + '. Your message was saved — try sending again.', error: true });
      renderMessages();
      persistChat(chat);
      setStatus('Error — see message below', true);
    }finally{
      state.sending = false;
      el.sendBtn.disabled = false;
      renderChatList();
    }
  }

  // ---------- TEMPLATES ----------
  el.templatesToggle.onclick = () => { el.tplOverlay.classList.add('open'); };
  el.tplClose.onclick = () => { el.tplOverlay.classList.remove('open'); };
  el.tplOverlay.onclick = (e) => { if(e.target === el.tplOverlay) el.tplOverlay.classList.remove('open'); };

  function renderTemplateList(){
    el.tplList.innerHTML = '';
    el.tplCount.textContent = state.templateOrder.length ? state.templateOrder.length : '';
    if(state.templateOrder.length === 0){
      const hint = document.createElement('div');
      hint.style.color = 'var(--text-faint)';
      hint.style.fontSize = '12.5px';
      hint.textContent = 'No saved instructions yet. Create one below — it applies as a system prompt to whichever conversation you attach it to.';
      el.tplList.appendChild(hint);
    }
    for(const id of state.templateOrder){
      const t = state.templates[id];
      if(!t) continue;
      const chat = state.chats[state.activeChatId];
      const isActive = chat && chat.templateId === id;
      const item = document.createElement('div');
      item.className = 'tpl-item' + (isActive ? ' active-tpl' : '');
      const name = document.createElement('div');
      name.className = 'tpl-name';
      name.textContent = t.name;
      const prompt = document.createElement('div');
      prompt.className = 'tpl-prompt';
      prompt.textContent = t.prompt.length > 140 ? t.prompt.slice(0,140) + '…' : t.prompt;
      const actions = document.createElement('div');
      actions.className = 'tpl-actions';
      const useBtn = document.createElement('button');
      useBtn.textContent = isActive ? 'In use' : 'Use in this chat';
      useBtn.disabled = !state.activeChatId;
      useBtn.onclick = () => {
        if(!state.activeChatId) return;
        state.chats[state.activeChatId].templateId = id;
        persistChat(state.chats[state.activeChatId]);
        updateActiveTemplatePill();
        renderTemplateList();
        el.tplOverlay.classList.remove('open');
      };
      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.className = 'danger';
      delBtn.onclick = async () => {
        delete state.templates[id];
        state.templateOrder = state.templateOrder.filter(x => x !== id);
        try{ await window.storage.delete('template:' + id, false); }catch(e){}
        persistTemplates();
        renderTemplateList();
      };
      actions.appendChild(useBtn);
      actions.appendChild(delBtn);
      item.appendChild(name);
      item.appendChild(prompt);
      item.appendChild(actions);
      el.tplList.appendChild(item);
    }
  }

  function updateSaveTplBtn(){
    el.tplSaveBtn.disabled = !(el.tplNameInput.value.trim() && el.tplPromptInput.value.trim());
  }
  el.tplNameInput.addEventListener('input', updateSaveTplBtn);
  el.tplPromptInput.addEventListener('input', updateSaveTplBtn);
  updateSaveTplBtn();

  el.tplSaveBtn.onclick = async () => {
    const name = el.tplNameInput.value.trim();
    const prompt = el.tplPromptInput.value.trim();
    if(!name || !prompt) return;
    const id = uid();
    const t = { id, name, prompt };
    state.templates[id] = t;
    state.templateOrder.unshift(id);
    try{
      await window.storage.set('template:' + id, JSON.stringify(t), false);
      await persistTemplates();
    }catch(e){ console.error(e); }
    el.tplNameInput.value = '';
    el.tplPromptInput.value = '';
    updateSaveTplBtn();
    renderTemplateList();
  };

  // ---------- VOICE INPUT ----------
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  if(SpeechRecognitionCtor){
    recognition = new SpeechRecognitionCtor();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      listening = true;
      el.micBtn.classList.add('listening');
      setStatus('Listening...');
    };
    recognition.onresult = (event) => {
      let transcript = '';
      for(let i = 0; i < event.results.length; i++){
        transcript += event.results[i][0].transcript;
      }
      el.input.value = transcript;
      el.input.style.height = 'auto';
      el.input.style.height = Math.min(el.input.scrollHeight, 180) + 'px';
    };
    recognition.onerror = (event) => {
      listening = false;
      el.micBtn.classList.remove('listening');
      if(event.error === 'not-allowed' || event.error === 'service-not-allowed'){
        setStatus('Microphone access denied', true);
      }else if(event.error === 'no-speech'){
        setStatus('');
      }else{
        setStatus('Voice input error: ' + event.error, true);
      }
    };
    recognition.onend = () => {
      listening = false;
      el.micBtn.classList.remove('listening');
      if(el.input.value.trim() && !state.sending){
        setStatus('');
        handleSend();
      }
    };

    el.micBtn.onclick = () => {
      if(listening){
        recognition.stop();
        return;
      }
      try{
        recognition.start();
      }catch(e){
        setStatus('Could not start microphone', true);
      }
    };
  }else{
    el.micBtn.classList.add('unsupported');
    el.micBtn.title = 'Voice input is not supported in this browser';
    el.micBtn.onclick = () => setStatus('Voice input is not supported in this browser', true);
  }

  // ---------- VOICE OUTPUT ----------
  let voicesReady = [];
  function loadVoices(){
    voicesReady = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  if(window.speechSynthesis){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text){
    if(!window.speechSynthesis || !el.speakToggle.checked) return;
    try{
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      const preferred = voicesReady.find(v => /en-US|en_US/.test(v.lang) && /female|Samantha|Google US English/i.test(v.name))
        || voicesReady.find(v => /^en/.test(v.lang));
      if(preferred) utter.voice = preferred;
      utter.rate = 1.02;
      window.speechSynthesis.speak(utter);
    }catch(e){
      console.error('Speech synthesis failed', e);
    }
  }

  el.speakToggle.addEventListener('change', async () => {
    try{
      await window.storage.set('setting:speak-replies', el.speakToggle.checked ? '1' : '0', false);
    }catch(e){}
    if(!el.speakToggle.checked && window.speechSynthesis){
      window.speechSynthesis.cancel();
    }
  });

  async function loadSpeakSetting(){
    const r = await safeGet('setting:speak-replies');
    if(r && r.value === '1'){
      el.speakToggle.checked = true;
    }
  }

  loadSpeakSetting();
  loadAll();
})();
</script>
</body>
</html>
